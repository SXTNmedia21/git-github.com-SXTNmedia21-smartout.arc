# Notes
notes: |
  Surface is real (not a redirect) — Wave 4 page with rich content: amendment diff
  banner, obligations list, PII RevealableField, TariffBadge, payroll detail row,
  contract history. Three harness tools cover the primary employee read intents.

  Amendment accept/decline intentionally NOT wired to tools (ADR-0151 — C4 gate
  for employee-impacting writes). Botsson can surface "you have a pending amendment"
  via getMyContractSummary.hasPendingAmendment, then user acts via UI.

  Download tool dispatches a CustomEvent; the page listens via useEffect + window
  event to avoid direct DOM manipulation in the tool layer.

  Next sortie:
  1. Add page description subtitle under h1 (Phase 6 completion).
  2. Audit /api/contracts/ route handlers for emit() + registry entries.
  3. Add site-map.json entry (Phase 8) — proposed entry is captured above.
  4. Lighthouse run when browser session available (Phase 1-3).
