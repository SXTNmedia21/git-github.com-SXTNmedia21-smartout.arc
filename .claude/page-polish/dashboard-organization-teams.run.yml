# Step 7 — Harness tools — SHIPPED
harness_tools:
  count: 4
  scope: organization-teams
  bridge_files:
    - apps/web/src/app/dashboard/organization/teams/_tools/use-teams-tools.ts
    - apps/web/src/app/dashboard/organization/teams/_tools/teams-tools-bridge.tsx
  registered_tools:
    - key: listTeams
      type: read
      note: all teams with member count, type, leader flag, department link
      params: [active_only (optional, bool), department_id (optional, string)]
    - key: getTeamDetail
      type: read
      note: single team by name (substring) or id, includes leader name + detail URL
      params: [teamName (optional), teamId (optional)]
    - key: proposeCreateTeam
      type: write-propose
      note: dispatches CustomEvent "botsson:open-create-team-dialog" — no direct DB write
      params: []
    - key: proposeAssignLeader
      type: write-propose
      note: dispatches CustomEvent "botsson:navigate" to team detail /members tab; leader is a team attribute (not a role) per cascade rules
      params: [teamName (optional), teamId (optional)]

