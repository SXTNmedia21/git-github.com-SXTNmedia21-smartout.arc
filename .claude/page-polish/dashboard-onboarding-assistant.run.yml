# Step 7 — Page Knowledge
page_knowledge:
  header: "Onboarding Assistant"
  description: "Guided AI assistant for completing workspace setup — start an onboarding session from the setup wizard to activate."
  empty_copy: "Start en ny onboarding-prosess fra oppsettsveiviseren for å bruke assistenten."
  error_copy: null   # No error state — static holding view

# Step 8 — Harness tools
harness_tools:
  page_key: onboarding-assistant
  tools:
    - key: getOnboardingProgress
      description: "Get the workspace's overall onboarding completion status — how many steps are done vs total. Use when user asks 'er vi ferdige med onboarding?', 'hvor langt har vi kommet?' or 'hva mangler for å sette opp arbeidsplassen?'."
      parameters: {}
    - key: listOnboardingSteps
      description: "List all onboarding steps with their completion status. Use when user wants a full overview of what is done and what remains, e.g. 'vis alle stegene' or 'hva gjenstår i oppsettet?'."
      parameters: {}
    - key: getCurrentStep
      description: "Get the onboarding step the workspace is currently working on. Use when user asks 'hvilket steg er vi på nå?' or 'hva er neste i onboarding?'."
      parameters: {}
    - key: openStep
      description: "Navigate the user to the setup wizard at a specific onboarding step. Use when user says 'åpne steg X', 'ta meg til [stegnavn]' or 'jeg vil fullføre [steg]'."
      parameters:
        stepId: { type: string, required: true }
  data_source_note: |
    Bridge currently mounts with static empty defaults (steps=[], completedCount=0,
    totalCount=0) because AssistantUI is a holding placeholder. When the setup
    wizard wires real session state, lift step data to page.tsx and pass live values
    to the bridge via props.

