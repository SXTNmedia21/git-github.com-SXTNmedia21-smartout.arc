    - use-website.ts  (useWebsite — fetches WebsiteRow)
    - use-pages.ts    (usePages — fetches PageRow[])
    - use-sections.ts (useSections — fetches SectionRow[])
    - use-templates.ts (useTemplates — synchronous registry read)
  data_source: "Supabase direct (createClient) via websites schema — service role"
  state: live (real data from Supabase local)
  notes: |
    WebsiteOverview (client) hosts WebsiteToolsBridge with live website + pages.
    SetupWizard (client) hosts WebsiteSetupToolsBridge with live step + templates.
    SectionEditor (client) hosts WebsitePageEditorToolsBridge with live sections + saveState.
    Bridge props derived from existing hook results — no duplicate fetches.

