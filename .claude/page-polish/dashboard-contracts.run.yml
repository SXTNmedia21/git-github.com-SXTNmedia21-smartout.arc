  cold:  { lcp_ms: null, cls: null, tti_ms: null, inp_ms: null }
  warm:  { lcp_ms: null, cls: null, tti_ms: null, inp_ms: null }

checklist:
  lighthouse_lcp_under_1500ms: false   # baseline_blocker — requires browser session
  no_skeleton_flash: null              # needs browser confirm
  motion_tokens_used: true             # 0 raw springs (no motion on this page)
  telemetry_emit_per_mutation: true    # useComposeContract has emit() in onSuccess; useSendContract is server-side
  page_knowledge_written: true
  page_knowledge_db_synced: false
  harness_tools_registered: true       # 7 tools live
  retest_improved: false               # blocked
  adr_0238_surface_disambiguation: false  # not applicable — no in-page chat surface

notes: |
  Contracts = D2 (Resource Availability) surface per cascade model.
  employment_contract rows are the primary entity; contract rows
  (DocuSeal signing documents) are joined via signing_contract_id FK.

  Bridge approach: page.tsx fetches a lightweight snapshot for Botsson
  (no pagination, page 1 only, ~20 rows). This is intentionally parallel to
  KontrakterTab's own paginated fetch — bridge data is "good enough" for
  Botsson queries without blocking the main list render.

  ADR-0238 check: BotssonAmbientChip is a nav shortcut (not a chat surface),
  so owns_chat_surface=false and no <DomainChatOwnership> is needed.

  Write tools are intentionally ABSENT at list level. Mutations (send, cancel,
  sign) live in [id] detail and new/ flow. This matches the scope boundary in
  the task brief.

  Phase 1 (Lighthouse) deferred — needs `op run -- pnpm --filter web dev` +
  Lighthouse extension. LCP expected <1500ms (no heavy lazy imports at hub level).

  baseline_blockers:
    lighthouse_lcp_under_1500ms: requires dev server + browser session
    retest_improved: same blocker
