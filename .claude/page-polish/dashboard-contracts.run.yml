design:
  zinc_hits: 0           # 0 hardcoded zinc/gray/slate
  motion_token_hits: 0   # No raw stiffness/damping in page tree
  hardcoded_color_hits: 0
  emoji_hits: 0
  adr_0238_owns_chat_surface: false
    # Contracts hub does NOT host an in-page chat surface.
    # BotssonAmbientChip is a navigation shortcut chip, not a chat surface.
    # No <DomainChatOwnership> needed — Orb operates in interactive mode.

page_knowledge:
  header: "Kontrakter" (i18n: page.title)
  description: "Opprett, send og følg opp ansettelseskontrakter — fra utkast til signatur." (i18n: page.description)
  empty_copy: (handled inside ContractsDataTable component)
  create_cta: "Lag kontrakt" (opens EmployeePickerDrawer → ContractDispatchDrawer)

telemetry:
  emit_in_page: 2
    - contract.hub_viewed (on mount, once workspaceId + profileId known)
    - contracts.compose.opened (on Lag-kontrakt CTA click)
  emit_in_hooks:
    - contracts.compose.submitted (useComposeContract onSuccess)
  emit_server_side:
    - contract.sent (useSendContract — server route fires after DocuSeal call)
  registry_entries_verified: true  # all events appear in packages/telemetry/src/registry.ts

