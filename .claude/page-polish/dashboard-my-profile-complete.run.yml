verified_at: 2026-05-14T17:45:00+02:00

# Step 1 — Locate
locate:
  pwd: /home/sxtnl/dev/smartout.ai
  git_branch: development
  url: https://app.smartout.ai/dashboard/my-profile/complete
  components_count: 3 # page.tsx + use-tools + bridge

# Step 2 — Architecture
architecture:
  entry: apps/web/src/app/dashboard/my-profile/complete/page.tsx
  tools:
    - apps/web/src/app/dashboard/my-profile/complete/_tools/use-my-profile-complete-tools.ts
    - apps/web/src/app/dashboard/my-profile/complete/_tools/my-profile-complete-tools-bridge.tsx
  rpc:
    - submit_own_pii (identity group: personal_number)
    - submit_own_pii (address group: address_line_1, postal_code, city)

# Step 3 — Skills loaded
skills_loaded:
  - smartout-page-polish
  - smartout-nordic-split

# Step 4 — Datapoints
datapoints:
  - source: form_local_state
    fields: [personal_number, address, postal_code, city]
  - source: DashboardContext
    fields: [workspaceData.workspace_id, profileId]
  - source: supabase.auth.getUser
    fields: [user.id]
server_actions: []
create_entry_points:
  - submit_own_pii RPC (identity + address groups)
  - emit "contract intake field submitted" telemetry

# Step 5 — Design
design:
  zinc_hits: 0
  motion_token_hits: 0
  hardcoded_color_hits: 0
  font_heading_used: false # form-only surface, no h1 with font-heading

# Step 6 — Page knowledge
page_knowledge:
  header: Fullfør profilen din
  description: Employee self-service PII intake for employment contract generation.
  success_copy: Informasjonen er lagret. Du kan lukke denne siden.
  error_copy: Noe gikk galt. Prøv igjen.

# Step 7 — Harness tools — SHIPPED
harness_tools_current:
  count: 3
  scope: my-profile-complete
  bridge_files:
    - apps/web/src/app/dashboard/my-profile/complete/_tools/use-my-profile-complete-tools.ts
    - apps/web/src/app/dashboard/my-profile/complete/_tools/my-profile-complete-tools-bridge.tsx
  registered_tools:
    - { key: getCompleteProfileStatus, type: read, note: returns submitted|filling|empty|submitting }
    - { key: getCompleteProfileFieldState, type: read, note: per-field filled booleans only — NO values }
    - { key: getCompleteProfileFieldHelp, type: read, note: explains what each field is and why }

# Step 8 — PII safety (CRITICAL — ADR-0077)
pii_safety:
  values_in_tool_results: false # tools NEVER return personnummer/address/postnummer/by values
  filled_state_only: true       # only booleans flow through Botsson context
  submit_via_tool: false        # no Botsson submit tool — human must press button
  channel_restriction: ADR-0078 # chat-only; voice forbidden on this surface
  notes: |
    Per ADR-0077, PII fields (personnummer + address) must not be exposed
    through agent context. The tool input contract (MyProfileCompleteToolInput)
    accepts only boolean filled-state per field — never the strings themselves.
    Bridge mirrors this — receives booleans only.

# Step 9 — Speed test (DEFERRED)
speed_test:
  cold: { lcp_ms: null, cls: null, tti_ms: null, inp_ms: null }
  warm: { lcp_ms: null, cls: null, tti_ms: null, inp_ms: null }
  baseline_blocker: "dev server unavailable — coordinator follow-up"

# Step 10 — Re-test (DEFERRED)
retest:
  cold: { lcp_ms: null, cls: null }
  warm: { lcp_ms: null, cls: null }
  improved: null

# Step 11 — Telemetry
telemetry:
  emit_in_route: 1 # "contract intake field submitted" on successful submit
  mutations_count: 1 # submit_own_pii RPC (1-2 calls depending on filled groups)
  emit_per_mutation: true

# Step 12 — Verification checklist
checklist:
  lighthouse_lcp_under_1500ms: false # baseline_blocker
  no_skeleton_flash: true
  motion_tokens_used: true # n/a — no motion on form
  telemetry_emit_per_mutation: true
  page_knowledge_written: true
  page_knowledge_db_synced: false
  harness_tools_registered: true
  retest_improved: false # baseline_blocker
  pii_not_in_tool_results: true

# Notes
notes: |
  Status-only tools, no PII leakage through agent context (ADR-0077).
  Chat-only channel (ADR-0078) — voice surface forbidden.
  Form's own submit button handles RPC + telemetry — Botsson does NOT
  have a submit tool. Human must press button.

  access: employee + manager + admin + owner. ADR-0238 owns_chat_surface=false.
  ADR-0151: workspace_id/profile_id from DashboardContext (auth-derived).
