# Step 8 — Harness tools
harness_tools_current:
  count: 8
  registered_at: apps/web/src/app/dashboard/governance/_tools/governance-tools-bridge.tsx
  page_key: governance
  read:
    - key: getGovernanceState
      desc: "Get current governance dashboard state — overall readiness %, total protocols, overdue count, open deviations, blocking deviations, active tab. Call first on any open-ended governance question."
    - key: listProtocols
      desc: "List all active D3-layer protocols with completion %, assignment counts, and policy type. Optional filter by policy_type or sort."
    - key: getProtocolDetail
      desc: "Get detailed status breakdown (completed/in_progress/not_started/expired/waived) for a single D3-layer protocol."
    - key: listOverdueItems
      desc: "List D3-layer protocols with expired assignments or completion below threshold (default 80%). Use for compliance gap analysis."
    - key: listOpenDeviations
      desc: "List open C4-layer deviations. Optional blocking_only flag to surface only those that block day-approval."
  write_propose:
    - key: proposeAssignProtocol
      desc: "Navigate to the governance sub-tab and open the assign-protocol sheet for a protocol. User selects employees and confirms. NEVER assigns directly."
    - key: proposeCreateDeviation
      desc: "Navigate to the deviations tab so manager can create a new C4-layer deviation via DeviationForm."
  navigation:
    - key: switchGovernanceTab
      desc: "Navigate to a specific HMS sub-tab: oversikt | drift | training | documents | deviations | governance."

