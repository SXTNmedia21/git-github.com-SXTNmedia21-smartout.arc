notes: |
  Architecture note: /dashboard/governance is a redirect shell — the real governance
  surface lives under /dashboard/hms. The bridge is mounted in governance/page.tsx
  (client component) which sources data from useGovernanceFiltered + useDeviations
  (same hooks as OversiktDashboard — TanStack cache shared, no extra fetches).

  Cascade vocabulary in tool descriptions:
    - D3 (Rules & Constraints): listProtocols, getProtocolDetail, listOverdueItems reference
      policy → protocol → procedure / knowledge_test / confirmation chain.
    - C4 (Policy & Governance): listOpenDeviations, proposeCreateDeviation reference
      C4-layer deviation and day-approval gate.
    - getGovernanceState surfaces both D3 (protocol count) and C4 (deviation count + blocking).

  Telemetry audit:
    - updatePolicyAction: emits governance.content_updated (awaited, server-side) ✓
    - updateProtocolAction: emits governance.content_updated (awaited, server-side) ✓
    - reportDeviationAction: emits server-side per ADR-0114 closure ✓
    - useAssignProtocol / useBulkAssignProtocol / useWaiveAssignment / useRevokeAssignment:
      emit "button clicked" with trackingId. TODO comments note proper event names
      pending plan-phase-2 registration in registry.ts.
    - useCreatePolicy / useCreateProtocol / useCreateProcedure / useCreateKnowledgeTest
      / useCreateConfirmation: emit "button clicked" with trackingId.
      TODO comments note proper event names pending plan-phase-2.

  ADR-0151 compliance:
    - Both server actions derive workspace_id via resolveCurrentProfile() (JWT path).
    - Bridge tools do NOT pass workspace_id in body — confirmed.
    - reportDeviationAction workspace_id resolved server-side per ADR-0114.

  baseline_blockers:
    lighthouse_lcp_under_1500ms: requires dev server + browser session
    retest_improved: same blocker
    motion_tokens_used: bridge files return null — no animation surface; not a real blocker.
