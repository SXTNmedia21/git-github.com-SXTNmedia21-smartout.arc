page_knowledge:
  header: Avstemming
  description: Gjennomgå og lås dagens oppgjør — timer, omsetning og avvik — slik at lønnsgrunnlaget er klart.
  empty_copy: Ingen oppgjør registrert for valgte filter. Prøv å nullstille filtrene, eller se at skift-leder har stemplet ut.
  error_copy: Klarte ikke laste oppgjørsliste. Sjekk nettverket og last siden på nytt. Pågående endringer er ikke påvirket.

# ADR-0238 surface disambiguation
adr_0238:
  owns_chat_surface: false
  domain_chat_endpoint: null
  notes: No in-page chat textbox. BotssonShell renders normally at parent layout. No <DomainChatOwnership> needed.

harness_tools:
  count: 6
  registered_at: apps/web/src/app/dashboard/reconciliation/_tools/reconciliation-tools-bridge.tsx
  page_key: reconciliation
  read:
    - key: getReconciliationState
      description: "Get the current reconciliation page state — whether a day is open in detail view, its id, and summary counters (venter oppgjør, klar til å låse, låst). Call first when manager asks any open-ended question about avstemming."
    - key: listReconciliationDays
      description: "List reconciliation days with status, omsetning, and labor %. Use when manager asks 'hvilke dager venter oppgjør?', 'vis forrige ukes avstemminger', or wants an overview of recent days. Optionally filter by status or date range."
    - key: getReconciliationDetail
      description: "Get full detail for a specific reconciliation_id — revenue breakdown, labor %, session info, preflight blocker count. Use when manager asks 'hva er status på lørdag?' and a reconciliation is already selected, or call after switchDate."
    - key: listPendingHours
      description: "List shift approvals still waiting for timegodkjenning for a reconciliation. Use when manager asks 'hvilke vakter mangler godkjenning?' or 'er det timer som ikke er godkjent?'."
    - key: listDeviationsForDay
      description: "List deviations for a reconciliation — status, severity, whether they block approval. Use when manager asks 'hvilke avvik blokkerer godkjenning?' or 'vis avvik for denne dagen'."
  navigation:
    - key: switchDate
      description: "Open a specific reconciliation in detail view by id or date. Use when manager says 'åpne oppgjøret for fredag', 'gå til lørdag', or names a specific day. Resolves by date if date given, by id if UUID given."

  write_tool_debt: |
    lockReconciliation, revertReconciliation, confirmHours deferred.
    Lock mutation (DayDetail lockDayMutation) and approve (useApproveReconciliation) require
    DashboardContext.profileId + sonner toast — not safe to invoke outside the owner component.
    Pattern: proposal tool that opens the approve-panel and focuses the "Godkjenn" button.
    Implement when DayDetail refactors to accept an external approve-trigger ref.

