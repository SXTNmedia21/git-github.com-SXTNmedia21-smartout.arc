  error_copy: "Fail-open — empty array returned on fetch error (console.error only). error.tsx deferred Track B."

# Step 9 — Harness tools (Phase 7) — SHIPPED 2026-05-16
harness_tools:
  registered_count: 2
  source_key: "admin-pos-accounts"
  hook_file: "apps/web/src/app/dashboard/admin/pos-accounts/_tools/use-pos-accounts-tools.ts"
  bridge_file: "apps/web/src/app/dashboard/admin/pos-accounts/_tools/pos-accounts-tools-bridge.tsx"
  island_export: "PosAccountsToolsBridge"
  mounted_in: "apps/web/src/app/dashboard/admin/pos-accounts/_components/PosAccountsList.tsx"
  adr_compliance:
    - "ADR-0244: read-only tools only. No connectPosAccount / disconnectPosAccount."
    - "ADR-0077: oauth_token and refresh_token excluded from all tool responses."
    - "ADR-0288: disconnect is chat-only — no disconnect tool registered."
    - "ADR-0151: workspace_id resolved server-side via RLS — not a tool parameter."
  tools:
    - modelToolName: getPosAccountsState
      kind: read
      description: >
        Get current POS account inventory — count and per-account public metadata
        (name, external ID, connected date, active status). Use to answer
        'hvor mange POS er tilkoblet?', 'hvilke kontoer er aktive?',
        or any status question about POS integrations. Never exposes oauth_token.
    - modelToolName: getPosActionState
      kind: read
      description: >
        Get action-gate flags for POS management — whether a new account can be
        connected and whether an active account exists. Use before proposing a
        connect action or answering 'kan jeg koble til Lightspeed?'.
        Returns a Norwegian hint for the current state.

