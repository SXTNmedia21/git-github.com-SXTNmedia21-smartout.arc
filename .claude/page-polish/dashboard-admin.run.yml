# Notes
notes: |
  Track A: tooling (read-only tools + bridge + site-map). Track B (loading.tsx + error.tsx)
  runs in parallel on separate files — not touched here.

  getPosAccountsState exposes only public metadata. The PosAccountRow shape from the server
  has `status` + `last_synced_at` + `created_at` — bridged to PosAccountsToolInput via
  inline useMemo in PosAccountsList: name from vendor display, is_active from status="active",
  connected_at from created_at. No oauth_token / refresh_token at any point (ADR-0077).

  workspaceIsActive is hardcoded `true` in the bridge mount because workspace active-status
  is not yet surfaced from the server context (resolveDashboardContext returns workspace_id
  but not a boolean isActive flag). A follow-up sortie should pass workspaceIsActive from
  server context when the flag is available. Until then canConnect defaults to true for
  all admin/owner users, which matches the current middleware gate.
