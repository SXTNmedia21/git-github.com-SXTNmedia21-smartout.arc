# Notes
notes: |
  Cost page is a read-only analytics surface — no mutations, no TanStack mutations, no emit() needed.
  Data source: shift_cost_snapshot → joined with schedule_shift → department + profile.
  Week navigation is purely client-state driven (weekOffset useState in CostOverview).

  Bridge pattern differs from billing: billing server-passes invoices[] as props to bridge.
  Cost cannot do this (data requires client hook + week-state), so bridge lives inside
  the CostOverview client island and receives live byDepartment/totals as props.

  Four tools cover all realistic Botsson use cases on this surface:
  - getCostOverview: aggregate weekly stats (planned, actual, variance, hours)
  - getLaborCostByPeriod: navigate to previous/next week + return data
  - getMarginAnalysis: department-level over/under budget analysis
  - getCostBreakdownByDepartment: single-department drilldown by name

  navigateWeek: bridge receives (relativeOffset) => setWeekOffset(prev => prev + relativeOffset)
  so Botsson can navigate relative to wherever the user currently is, not always from week 0.

