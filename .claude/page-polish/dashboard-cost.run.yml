  pwd: /home/sxtnl/dev/smartout.ai
  git_branch: development
  url: https://app.smartout.ai/dashboard/cost
  components_count: 6  # page.tsx, loading.tsx, 3 _components, 1 _hooks, 2 _tools (new)

# Step 2 — Architecture
architecture:
  entry: apps/web/src/app/dashboard/cost/page.tsx (Server Component, RSC shell)
  loading_fallback: apps/web/src/app/dashboard/cost/loading.tsx (SkeletonEntrance, matches 3-card + table layout)
  shell:
    container: space-y-6 p-4 — single-column layout
    header: h1 (text-foreground text-xl font-semibold) + week navigation buttons
    cards: 3 summary cards (Planlagt / Faktisk / Timer)
    table: DepartmentCostTable — 6 columns (Avdeling, Planlagt, Faktisk, Avvik, Timer, Vakter)
    empty: DepartmentCostTable renders centered "Ingen kostnadsdata" card when departments.length === 0
  state_machine:
    - loading    # isLoading === true → centered "Laster kostnadsdata..." text
    - empty      # byDepartment.length === 0 → DepartmentCostTable empty card
    - ready      # cards + table rendered
  variants: []   # No role branch — admin/manager only (workers redirect)

skills_loaded:
  - smartout-page-polish
  - smartout-nordic-split
  - smartout-cascade-developer

# Step 4 — Datapoints
datapoints:
  - { name: shift_cost_snapshot, source: useCostOverview, type: tanstack_query, params: "workspace_id + dateFrom + dateTo" }

server_actions: []  # No server actions — all data via client TanStack hook

mutations: []  # Root page is read-only analytics. No writes on this surface.

# Step 5 — Design pass
design:
  zinc_hits: 0
  motion_token_hits: 0
  hardcoded_color_hits: 0
  emoji_hits: 0
  font_heading_used: false   # h1 uses text-xl font-semibold (acceptable for compact header)
  font_mono_used: true       # font-mono on all NOK values and hours (tabular data)
  semantic_tokens:
    text-muted-foreground: present (card subtitles, week nav label, empty state)
    text-foreground: present (h1)
    text-destructive: present (over-budget variance)
    text-success: present (under-budget variance)
  loading_pattern: |
    loading.tsx uses SkeletonEntrance — matches 3-card grid + 5-row table skeleton.
    CostOverview loading state uses inline text (Laster kostnadsdata...) — acceptable,
    Suspense in page.tsx streams loading.tsx while RSC resolves workspace context.

# Step 6 — Page Knowledge
page_knowledge:
  header: "Lønnskostnad"
  description: "Ukentlig oversikt over lønnskostnad per avdeling — planlagt vs. faktisk, avvik og timer. Naviger uker med pilene."
  empty_copy: "Ingen kostnadsdata for valgt periode"   # in DepartmentCostTable
  error_copy: null   # No custom error.tsx — Next.js error boundary fallback

# Step 7 — Harness tools
harness_tools:
  - key: getCostOverview
    description: "Get an overview of labor costs for the currently visible week: total planned cost, actual cost, variance (NOK + %), and total hours. Use when user asks 'hva koster det denne uken?', 'hva er lønnskostnaden?', or 'er vi over budsjett?'."
    parameters: {}

  - key: getLaborCostByPeriod
    description: "Get cost data for a specific week by navigating: 'current' stays on this week, 'previous' goes one week back, 'next' goes one week forward. Use when user asks about a different week's costs or wants to compare periods."
    parameters:
      period: { type: string, enum: [current, previous, next], required: true }

  - key: getMarginAnalysis
    description: "Analyse cost variance across all departments: which departments are over budget, by how much, and what the total overage is. Use when user asks 'hvilke avdelinger er over budsjett?', 'hvor er avviket størst?', or 'kan du analysere kostnadene?'."
    parameters: {}

  - key: getCostBreakdownByDepartment
    description: "Get a detailed cost breakdown for a specific department by name: planned, actual, variance, hours, and shift count. Use when user asks 'hva koster [avdeling]?', 'vis meg kostnad for kjøkkenet', or references a specific department."
    parameters:
      departmentName: { type: string, required: true }

# Step 8 — Bridge implementation
bridge:
  hook_file: apps/web/src/app/dashboard/cost/_tools/use-cost-tools.ts
  bridge_file: apps/web/src/app/dashboard/cost/_tools/cost-tools-bridge.tsx
  mount_site: apps/web/src/app/dashboard/cost/_components/CostOverview.tsx (inside CostOverview return, last child)
  pattern: |
    Bridge mounted inside CostOverview client island (not in server page.tsx) because
    cost data is fetched client-side via useCostOverview — no server prefetch possible
    (week navigation is driven by client state; prefetching one week would be discarded
    on the first nav click). Bridge receives live props from the same component that
    owns useCostOverview, so no duplicate fetch.
  register_key: "cost"

