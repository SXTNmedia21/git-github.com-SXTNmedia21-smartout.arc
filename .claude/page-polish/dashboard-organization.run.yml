notes: |
  Scope: root /dashboard/organization only. Sub-routes (departments/, locations/, teams/)
  are separate polish passes with their own run.yml files.

  Cascade vocabulary in tool descriptions:
    - D1 (Envelope): listDepartments, listLocations, getDepartmentDetail reference
      permanent structural units (department + location).
    - D2 (Resource): listTeams references seasonal team overlay on D1 departments.
    - getOrganizationOverview surfaces both D1 counts and subscription/setup status.

  ADR-0151 compliance:
    - Root page has no server actions or write mutations.
    - Bridge tools read from page-level state (already fetched with workspace-scoped RLS).
    - workspace_id NOT passed in tool body — all data comes from pre-fetched state.

  Per-department profile count:
    - profiles[] is loaded at page level but not grouped by department_id in the tool input.
    - getDepartmentDetail and listDepartments return memberCount: 0 for this reason.
    - Full fix: add profilesByDept derivation in page.tsx (same pattern as positionsByDept).
    - Deferred: functional but incomplete — document here, fix in Phase 2.

  baseline_blockers:
    lighthouse_lcp_under_1500ms: requires dev server + browser session
    retest_improved: same blocker
