# Step 7 — Page Knowledge
page_knowledge:
  header: Organization
  description: "Company, workspace structure, and governance connections"
  empty_copy: "No departments yet. Create your first department to define the operational structure of your workspace."
  error_copy: "Could not load organization data. Check your connection and refresh the page."

# Step 8 — Harness tools
harness_tools_current:
  count: 7
  registered_at: apps/web/src/app/dashboard/organization/_tools/organization-tools-bridge.tsx
  page_key: organization
  read:
    - key: getOrganizationOverview
      desc: "Get the D1-envelope summary for this workspace — department count, location count, team count, active staff count, subscription plan/status, setup checklist progress, and current active tab. Call first when the user asks any open-ended question about the organization."
    - key: listDepartments
      desc: "List all D1-layer departments with their position count, member count, and policy count. Use when the user asks 'hvilke avdelinger har vi?', 'vis alle avdelinger', or wants to see department structure."
    - key: listLocations
      desc: "List all D1-layer locations with zone count, asset count, and policy count. Use when the user asks 'hvilke lokaler har vi?', 'vis lokasjoner', or needs a venue/premises overview."
    - key: listTeams
      desc: "List all teams with member count, team type, and linked department. Use when the user asks 'hvilke team finnes?', 'vis alle team', or wants a cross-department team overview."
    - key: getDepartmentDetail
      desc: "Get detailed info for a single D1-layer department — position count, active member count, policy count, and department metadata. Use when the user asks about a specific department by name or id."
    - key: getSetupChecklist
      desc: "Return the workspace setup checklist with completion state per item and overall progress %. Use when the user asks 'hva gjenstår i oppsettet?', 'er vi ferdig satt opp?', or wants to know what to configure next."
  navigation:
    - key: switchOrgTab
      desc: "Navigate to a specific organization sub-tab. Use when the user says 'vis avdelinger', 'gå til team', 'åpne lokasjoner', or navigates within the organization page. Accepts: overview | departments | locations | teams."

harness_tools_deferred:
  - key: openDepartment
    reason: "Requires navigation to departments/[id] sub-route — sub-route polish is a separate pass."
  - key: openLocation
    reason: "Requires navigation to locations/[id] sub-route — sub-route polish is a separate pass."
  - key: openTeam
    reason: "Requires navigation to teams/[id] sub-route — sub-route polish is a separate pass."

