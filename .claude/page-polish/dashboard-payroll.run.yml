# Step 5 — Datapoint mapping
datapoints:
  - { name: payroll_periods, source_table: payroll.payroll_period, hook: usePayrollPeriods, type: query }
  - { name: payroll_period, source_table: payroll.payroll_period, hook: usePayrollPeriod, type: query }
  - { name: payroll_lines, source_table: payroll.calculation, hook: usePayrollLines, type: query }
  - { name: calculations, source_table: payroll.calculation, hook: inline in LineDrawer, type: query }
  - { name: calculation_lines, source_table: payroll.calculation_line, hook: inline in LineDrawer, type: query }
  - { name: deviations, source_table: payroll.payroll_deviation, hook: usePayrollDeviations, type: query }
  - { name: manual_supplements, source_table: payroll.manual_supplement, hook: useManualSupplements, type: query }
  - { name: pending_overrides, source_table: payroll.change_proposal, hook: usePendingOverrides, type: query }
  - { name: workspace_framework, source_table: regulatory_framework, hook: useWorkspaceFramework, type: query }
  - { name: time_entries, source_table: timesheet.time_entry, hook: manualTimeEntryAction (server action), type: mutation }

# Step 6 — API routing
api_routes:
  - { method: POST, path: /api/payroll/derive-shift-hours, role: admin, used_by: recalculate }
  - { method: POST, path: /api/payroll/generate-pdf-single, role: admin, used_by: useGenerateSingle }
  - { method: POST, path: /api/payroll/generate-pdf-bundle, role: admin, used_by: useGenerateBundle }
  - { method: POST, path: /api/payroll/export-period, role: admin, used_by: useExportPeriod }
  - { method: POST, path: /api/payroll/snapshot-period-costs, role: admin, used_by: useLockPeriod }

