# Step 7 — Page Knowledge
page_knowledge:
  header: "Sesongdetaljer"
  description: "Konfigurer D4 budsjett, dag- og timefaktorer for én sesong, og aktiver den når alle krav er oppfylt."
  empty_copy: "Ingen budsjettdata ennå — gå til Budsjettering-fanen og sett omsetning for å starte konfigurasjonen."
  error_copy: "Klarte ikke laste sesongdata — sjekk tilkoblingen og last siden på nytt."

# Step 8 — Harness tools (6 tools — 4 read, 2 write)
harness_tools:
  - key: getSeasonStatus
    description: "Get the current season's metadata — name, status (draft/active/archived), start/end dates, season type, and planning cycle linkage. Call first when the user asks about this specific season or before proposing any action on it."
    parameters: {}
  - key: getActivationReadiness
    description: "Check whether this draft season is ready to activate — returns the D4 completeness checklist: budget set, day factors configured, hour factors configured, and whether season-specific operating hours exist (soft check). Use when user asks 'kan jeg aktivere denne sesongen?' or 'hva mangler?'."
    parameters: {}
  - key: getBudgetSummary
    description: "Return this season's D4 revenue budget — total target revenue (NOK), labor percentage, average hourly wage, base price per guest, and budget status (draft/active/locked). Use when user asks about revenue targets, cost ratios, or staffing economics for this season."
    parameters: {}
  - key: getFactorSummary
    description: "Summarise the D4 day-factor and hour-factor distribution for this season — highest/lowest weekday weights, peak operating hour. Use when user asks 'hvilken dag er høyest?', 'når er det travlest?', or needs to understand the demand distribution before activating."
    parameters: {}
  - key: proposeActivateSeason
    description: "Activate this season — calls the server action, archives the currently active season atomically, and seeds D1 operating-hours fanout. Use when user explicitly says 'aktiver denne sesongen' or confirms after getActivationReadiness shows all checks pass. Requires budget + day factors + hour factors."
    parameters: {}
  - key: proposeArchiveSeason
    description: "Archive this season (draft or active → archived). Use when user says 'arkiver denne sesongen' or wants to move it to archived state. Idempotent — safe to call if already archived."
    parameters: {}

