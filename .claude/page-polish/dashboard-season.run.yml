# Notes
notes:
  owns_chat_surface: false
  adr_0238_finding: |
    /dashboard/season/[seasonId] has no embedded domain chat textbox.
    BotssonShell operates in normal interactive mode.
    No <DomainChatOwnership> required.
  adr_0151_compliance: |
    Both activateSeasonAction and archiveSeasonAction resolve workspace_id + profile_id
    server-side via resolveCurrentProfile() — tool bodies pass NO workspace_id.
    Only season_id (entity reference) flows through tool call body.
    Fully compliant with ADR-0151.
    proposeActivateSeason and proposeArchiveSeason on season-tools use no parameters
    (season_id is derived from SeasonToolInput.season.season_id held in dataRef).
  telemetry_audit: |
    Write tools delegate to Server Actions which own emit():
    1. activateSeasonAction — emits: season activation_failed, season archived
       (displaced active season), season activated, season operating_hours_generated.
    2. archiveSeasonAction — emits: season archived (success path).
    Mutation hooks (upsertBudget, saveDayFactors, saveHourFactors) from
    packages/year-wheel/src/hooks emit in onSuccess callback.
    Page-view + tab-switch emits verified in season-page-client.tsx.
    All paths compliant.
  motion_token_debt: |
    No new motion introduced in _tools/**. Existing debt in [seasonId]/_components
    inherits from year-wheel component debt (open items tracked in dashboard-year-wheel.run.yml).
    No new hardcoded stiffness/damping/duration values added.
  cascade_vocabulary: |
    Season = D4/D5 authoring unit. Tools speak cascade vocabulary explicitly:
    - getActivationReadiness surfaces D4 completeness checks (budget/day/hour factors).
    - proposeActivateSeason references D1 fanout (operating-hours seeding).
    - getBudgetSummary labels fields as D4 revenue envelope.
    - getFactorSummary labels day/hour factors as D4 demand distribution.
  scope_note: |
    Season-detail tools are DISTINCT from year-wheel tools.
    Year-wheel scope = canvas-level (list all seasons, set year, filter sidebar).
    Season scope = detail-level (this season's readiness, budget, factors, activate/archive).
    No duplication with year-wheel-tools-bridge.tsx.
