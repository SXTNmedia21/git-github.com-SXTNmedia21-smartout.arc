notes: |
  Setup wizard is a one-time workspace bootstrap flow (9 steps covering
  governance, payroll, employment, team, schedule, season, handbook).
  Wizard state is managed internally by WizardShell (packages/ui) —
  page.tsx lifts read-only state via onContextChange callback chain.

  The SetupToolsBridge (Botsson harness) gets currentStepIndex +
  completedSteps + isLoading from the lifted state. Navigation tools use
  hard reload (window.location.href) with ?step= URL param because
  WizardShell does not expose a goTo imperative handle externally —
  wizard-appropriate UX: user controls step progression, Botsson guides.

  baseline_blockers:
    lighthouse_lcp_under_1500ms: requires dev server + browser session
    retest_improved: same blocker
    page_knowledge_db_synced: requires Supabase page_knowledge table write
    site-map: excluded from task scope per instructions
