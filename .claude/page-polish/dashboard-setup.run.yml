adr_0238:
  owns_chat_surface: false
  reason: |
    useWizardBotssonContext is a context-injection hook that sends wizard navigation
    context INTO Botsson's existing LLM session. It does NOT create a second chat
    surface — no <DomainChatOwnership> declaration needed.

# Step 7 — Harness tools
harness_tools:
  count: 6
  registered_at: apps/web/src/app/dashboard/setup/_tools/setup-tools-bridge.tsx
  page_key: setup
  read:
    - key: getSetupProgress
      desc: "Get overall workspace setup progress: how many steps are done, which modules are complete, and how many remain. Use when the user asks 'hva gjenstår?', 'er setup ferdig?', or 'hvor langt er jeg kommet?'."
    - key: listSetupSteps
      desc: "List all 9 setup wizard steps with their id, module, skippable flag, and whether completed this session. Use when the user asks to see the full setup checklist or wants to know which steps remain."
    - key: getCurrentStep
      desc: "Get the currently active setup step: id, index, module, and skippable flag. Use when the user asks 'hvor er jeg nå?', 'hvilket steg er jeg på?', or before calling proposeAdvanceStep."
  write_propose:
    - key: proposeAdvanceStep
      desc: "Advance the wizard to the next step. Only use when the user explicitly says they want to move on, skip, or continue to the next step. Does NOT apply when the user has content to fill in first."
  navigation:
    - key: openStep
      desc: "Jump directly to a named setup step. Use when the user wants to go to a specific step (e.g. 'gå til lønn' → payroll, 'åpne team-steget' → team). Valid ids: welcome, document-drop, governance, payroll, employment, team, shift-template, season, handbook."
    - key: restartSetup
      desc: "Restart the setup wizard from the first step. Use ONLY when the user explicitly asks to start over or reset setup. This reloads the page."

page_knowledge:
  header: Oppsett av arbeidssted
  description: Fullfør oppsettveiviseren for å aktivere alle moduler — tariff, ansatte, sesong og håndbok.
  empty_copy: Veiviseren er ikke fullført. Start fra steget du er på eller hopp til et bestemt steg.
  error_copy: Noe gikk galt i oppsettet. Last siden på nytt eller hopp over det aktuelle steget.

design:
  zinc_hits: 0
  motion_token_hits: 0
  hardcoded_color_hits: 0
  note: |
    AnimatedWizardShell (Tier 0 shared primitive) handles all motion and
    brand panel. SetupStepHeader uses CSS variables (text-foreground,
    text-muted-foreground, border-border, bg-muted). No page-level
    hardcoded colors or raw spring values introduced by this harness.

navigation_implementation:
  openStep: "window.location.href = /dashboard/setup?step=<id> — hard navigate triggers wizard remount; loadState override in page.tsx injects _initialStepIndex from ?step= param"
  proposeAdvanceStep: "Returns { ok: true, advancing: true, nextStepId } after dispatching CustomEvent('botsson:setup:advance') — Botsson relays the confirmation; user clicks Neste to proceed (wizard-appropriate UX: user controls step progression)"
  restartSetup: "sessionStorage.removeItem('setup_dismissed') + window.location.href = /dashboard/setup"

