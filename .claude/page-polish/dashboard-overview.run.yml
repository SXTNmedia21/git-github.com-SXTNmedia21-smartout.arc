# Step 3 — Skills loaded
skills_loaded:
  - smartout-page-polish
  - smartout-cascade-developer
  - smartout-database-guide
  - smartout-edge-function-guide

# Step 4 — Datapoints (read hooks per tab)
datapoints:
  # WebDayControl shell
  - { name: current_department,  source_table: profile + department, hook: useCurrentDepartment, type: query }
  - { name: department_sessions, source_table: department_session,   hook: useDepartmentSessions, type: query }
  - { name: daily_reconciliation, source_table: daily_reconciliation, hook: useDailyReconciliation, type: query }

  # OverviewTab
  - { name: deviations_open,     source_table: deviation,             hook: useDeviations({status:[open,acknowledged]}), type: query }
  - { name: deviations_escalated, source_table: deviation,            hook: useDeviations({status:[escalated]}), type: query }
  - { name: roster,              source_table: schedule_shift+profile, hook: useRoster, type: query }
  - { name: shift_day_stats,     source_table: schedule_shift,        hook: useShiftDayStats, type: query }
  - { name: day_budget,          source_table: workspace_budget+day_factor, hook: useDayBudget, type: query }
  - { name: session_hooks_with_tasks, source_table: session_hook+session_task, hook: useSessionHooksWithTasks, type: query }
  - { name: cascade_tasks,       source_table: derived (D1-D6/C1-C4), hook: useCascadeTasks, type: query }
  - { name: day_timeline_events, source_table: bookings+notes+tasks+deviations+time_entry, hook: useDayTimelineEvents, type: query }

  # RosterTab
  - { name: live_shifts,         source_table: timesheet.time_entry, hook: useLiveShifts, type: query }

  # TasksTab
  - { name: session_hooks,       source_table: session_hook,         hook: useSessionHooksWithTasks, type: query }

  # DeviationsTab
  - { name: deviations_filter,   source_table: deviation,            hook: useDeviations, type: query }

  # BroadcastTab — pure mutation, no read-side query

  # ReconciliationView (variant)
  - { name: reconciliation_list, source_table: daily_reconciliation, hook: useReconciliationList, type: query }

# Step 5 — Server Actions / Mutations (canonical create+mutate inventory)
server_actions:
  - { name: transitionSessionAction,    file: app/dashboard/_actions/transition-session-action.ts,    purpose: "session phase: active|pending_signoff|closed|missed (+ admin reverts)", used_in: [SessionActionsBar] }
  - { name: openSessionAction,          file: app/dashboard/_actions/open-session-action.ts,          purpose: "create department_session for date", used_in: [NoSessionCTA] }
  - { name: signoffSessionAction,       file: app/dashboard/_actions/signoff-session-action.ts,       purpose: "sign off + close session (admin or self)", used_in: [SignoffTab] }
  - { name: pinDayControlContextAction, file: app/dashboard/_actions/pin-day-control-context.ts,      purpose: "pin context to engine_memory (24h TTL) for Botsson", used_in: [WebDayControl useEffect] }
  - { name: addShiftAction,             file: app/dashboard/_actions/add-shift-action.ts,             purpose: "create schedule_shift row for date+dept", used_in: [AddShiftDialog (RosterTab)] }
  - { name: manualTimeEntryAction,      file: app/dashboard/_actions/manual-time-entry-action.ts,     purpose: "admin retro punch-in/out for shift", used_in: [RosterTab] }
  - { name: addTaskAction,              file: app/dashboard/_actions/add-task-action.ts,              purpose: "create session_task on hook", used_in: [AddTaskDialog (TasksTab)] }
  - { name: toggleSessionTaskAction,    file: app/dashboard/_actions/toggle-session-task-action.ts,   purpose: "mark session_task done|undone", used_in: [TasksTab] }
  - { name: sendBroadcastAction,        file: app/dashboard/_actions/send-broadcast-action.ts,        purpose: "broadcast message to all/leaders/role on date", used_in: [BroadcastTab] }
  - { name: activateSeasonAction,       file: app/dashboard/_actions/activate-season-action.ts,       purpose: "set season status=active", used_in: [SeasonTab/StrategicView] }
  - { name: archiveSeasonAction,        file: app/dashboard/_actions/archive-season-action.ts,        purpose: "set season status=archived", used_in: [SeasonTab] }
  - { name: duplicateSeasonAction,      file: app/dashboard/_actions/duplicate-season-action.ts,      purpose: "clone season + budget into new season", used_in: [SeasonTab] }

# Step 6 — Create-funksjoner (UI entry points → Server Actions)
create_entry_points:
  # WebDayControl shell
  - { tab: shell,      ui: NoSessionCTA,           action: openSessionAction,          input: {date, department_id} }
  - { tab: shell,      ui: SessionActionsBar,      action: transitionSessionAction,    input: {session_id, target} }

  # OverviewTab — read-mostly. Drawer opens for entity edit.
  - { tab: overview,   ui: KpiAccentTile clicks,   action: navigation only (no mutation) }
  - { tab: overview,   ui: DeviationCard click,    action: drawer.openDrawer("deviation") (read+update via drawer) }

  # RosterTab — biggest create surface
  - { tab: roster,     ui: AddShiftDialog,         action: addShiftAction,             input: {date, dept, employee_id, start, end, role, reason} }
  - { tab: roster,     ui: ShiftSheet,             action: manualTimeEntryAction,      input: {shift_id, punch_in_iso, punch_out_iso, reason} }
  - { tab: roster,     ui: AlertDialog override hours, action: manualTimeEntryAction (variant) }

  # TasksTab
  - { tab: tasks,      ui: AddTaskDialog,          action: addTaskAction,              input: {session_id, hook_id, title, assignee?} }
  - { tab: tasks,      ui: HookTile checkbox,      action: toggleSessionTaskAction,    input: {task_id, done} }

  # DeviationsTab — currently read-only
  - { tab: deviations, ui: DeviationCard click,    action: drawer.openDrawer("deviation") }
  - { tab: deviations, ui: GAP — no inline "create deviation" CTA, action: missing — see harness_tools_proposed }

  # BroadcastTab
  - { tab: broadcast,  ui: BroadcastComposer,      action: sendBroadcastAction,        input: {dept_or_workspace, audience, body, channels[]} }

  # SignoffTab (admin path)
  - { tab: signoff,    ui: SignoffPanel,           action: signoffSessionAction,       input: {session_id, role: admin|self, signature?} }

  # Variant: ActivityView, StrategicView — read-only.
  # Variant: ReconciliationView — has 2 mutations (reconciliation lock + revert).
  # Variant: TodoTaskView — has 2 mutations (assign, complete).

# Step 7 — Telemetry audit
telemetry:
  files_touched: 7  # 6 tabs + WebDayControl + SessionActionsBar + ReconciliationView + TodoTaskView
  emit_in_tab_files: 0  # GAP — emit() not called inside any /components/day/* file
  expected_emit_per_action: |
    Server Actions are in app/dashboard/_actions/. emit() likely lives there
    (server-side, after DB write). Tab UI files merely invoke; emit responsibility
    is in the action body. Audit needed: open each *-action.ts file, confirm emit().
  audit_required:
    - app/dashboard/_actions/transition-session-action.ts
    - app/dashboard/_actions/open-session-action.ts
    - app/dashboard/_actions/signoff-session-action.ts
    - app/dashboard/_actions/add-shift-action.ts
    - app/dashboard/_actions/manual-time-entry-action.ts
    - app/dashboard/_actions/add-task-action.ts
    - app/dashboard/_actions/toggle-session-task-action.ts
    - app/dashboard/_actions/send-broadcast-action.ts
    - app/dashboard/_actions/activate-season-action.ts
    - app/dashboard/_actions/archive-season-action.ts
    - app/dashboard/_actions/duplicate-season-action.ts

# Step 8 — Page Knowledge
page_knowledge:
  oversikt:
    header: Oversikt
    description: Daglig oversikt over avdelingens drift — bemanning, oppgaver, avvik, meldinger og økonomi for den valgte dagen.
    empty_copy: Ingen sesjon for denne dagen. Åpne dagen via "Start dag"-knappen for å aktivere bemanning og oppgaver.
    error_copy: Klarte ikke å laste dagsoversikten. Prøv å laste siden på nytt — usynkroniserte endringer er trygge i utkast.
  strategic:
    header: Strategisk
    description: KPI-er, mål og utvikling på tvers av avdelinger og sesong.
  activity:
    header: Aktivitet
    description: Logg over alt som har skjedd i workspace — handlinger, mutasjoner, agent-kall.
  reconciliation:
    header: Avstemming
    description: Lukk dagen, godkjenn vakter, avstem timer mot punch-in/ut og utbetalinger.
  todo:
    header: Å gjøre
    description: Personlige og delegerte oppgaver fra cascade-modellen (D1–D6 + C1–C4) sortert på hast.

