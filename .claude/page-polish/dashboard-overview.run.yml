# Step 10 — Harness tools — PROPOSED REGISTRY
harness_tools_proposed:
  page_key: oversikt    # one registry per variant; oversikt is the workhorse
  read_tools:
    - { key: getDaySnapshot,
        description: "Get full day snapshot — phase, bemanning, oppgaver, avvik, omsetning. Call first on any day-control question.",
        params: {date: optional ISO, departmentId: optional},
        backed_by: [useDepartmentSessions, useRoster, useDeviations, useDayBudget, useSessionHooksWithTasks] }
    - { key: getRosterForDay,
        description: "List staff scheduled or active for a date — names, role, status (upcoming/active/completed), planned vs actual hours.",
        params: {date: ISO, departmentId: optional},
        backed_by: [useRoster, useLiveShifts] }
    - { key: getOpenDeviations,
        description: "List open + acknowledged + escalated deviations. Use when manager asks 'hva må jeg fikse i dag?'.",
        params: {sessionId: optional, severity: optional},
        backed_by: [useDeviations] }
    - { key: getSessionTasks,
        description: "List session_task rows grouped by hook (pre_open / open / scheduled / pre_close / close). Returns done/active counts.",
        params: {sessionId: required},
        backed_by: [useSessionHooksWithTasks] }
    - { key: getDayBudget,
        description: "Get day's revenue budget, labor cost, labor hours, day_factor + hour_factor. For 'hva er omsetning i dag'.",
        params: {date: ISO, departmentId: required},
        backed_by: [useDayBudget] }
    - { key: getCascadeMustDo,
        description: "Get cascade-derived urgent items (D1-D6 + C1-C4) marked critical or should. Drives MustDoCard.",
        params: {sessionId: optional},
        backed_by: [useCascadeTasks] }
    - { key: getDayActivity,
        description: "Timeline of events for the day — bookings, notes, tasks, deviations, check-ins, check-outs.",
        params: {date: ISO, departmentId: required, sessionId: required},
        backed_by: [useDayTimelineEvents] }

  write_tools:
    - { key: openSession,
        description: "Open today's department_session — required before bemanning can clock in. Call when manager says 'start dagen'.",
        params: {date: ISO, departmentId: required, plannedOpen: HHMM, plannedClose: HHMM},
        action: openSessionAction,
        authority: requires C4 'session.open' }
    - { key: transitionSession,
        description: "Move session to next phase. Targets: 'active' (start), 'pending_signoff' (close shift), 'closed' (lock day).",
        params: {sessionId, target: active|pending_signoff|closed|missed},
        action: transitionSessionAction,
        authority: requires C4 'session.transition' }
    - { key: signoffSession,
        description: "Sign off the day after pending_signoff. Use when manager confirms hours + reconciliation are correct.",
        params: {sessionId, role: admin|self},
        action: signoffSessionAction,
        authority: requires C4 'session.signoff' }
    - { key: addShift,
        description: "Add an unplanned shift to a date — use for last-minute extra coverage. Requires reason for audit trail.",
        params: {date, departmentId, employeeId, start, end, role?, reason},
        action: addShiftAction,
        authority: requires C4 'shift.create' }
    - { key: manualTimeEntry,
        description: "Admin retro records punch-in/out for a shift when the employee forgot or punch was lost.",
        params: {shiftId, punchInISO, punchOutISO?, reason},
        action: manualTimeEntryAction,
        authority: requires C4 'time_entry.manual' }
    - { key: addSessionTask,
        description: "Add an ad-hoc task to a session hook (e.g. 'sjekk frysere før close'). Goes into TasksTab list.",
        params: {sessionId, hookId, title, assigneeProfileId?},
        action: addTaskAction,
        authority: requires C4 'session_task.create' }
    - { key: toggleSessionTask,
        description: "Mark a session_task done or undone. Use when manager confirms or reverses task completion.",
        params: {taskId, done: bool},
        action: toggleSessionTaskAction,
        authority: requires C4 'session_task.toggle' }
    - { key: sendBroadcast,
        description: "Broadcast a message to all/leaders/role on a date. Channels: in-app, email, sms (priority-gated).",
        params: {audience: all|leaders|role, body, channels: [in_app, email, sms], priority: 0|1|2},
        action: sendBroadcastAction,
        authority: requires C4 'broadcast.send' + voice-channel-restricted (ADR-0078) }

  navigation_tools:
    - { key: switchDayTab,
        description: "Switch active tab inside day-control: oversikt|dagslinje|bemanning|oppgaver|avvik|melding.",
        params: {tab: overview|timeline|roster|tasks|deviations|broadcast},
        scope: client-only setState }
    - { key: switchDate,
        description: "Move day-control to a different date (yesterday/tomorrow/specific ISO).",
        params: {date: ISO},
        scope: client-only setDateISO }
    - { key: switchVariantView,
        description: "Switch dashboard variant: oversikt|strategic|reconciliation|activity|todo.",
        params: {variant: oversikt|strategic|reconciliation|activity|todo},
        scope: useAdminContext setAdminView }

  scopes_separation:
    note: |
      Three separate useRegisterTools registrations recommended:
      - useRegisterTools("oversikt", {...}) — covers WebDayControl + 6 tabs (most tools above).
      - useRegisterTools("strategic", {...}) — strategic KPIs read tools only.
      - useRegisterTools("activity", {...}) — activity log search/filter tools only.
      - useRegisterTools("reconciliation", {...}) — reconciliation lock/revert tools.
      - useRegisterTools("todo", {...}) — task assignment + complete.

