# Step 1 — Locate
locate:
  pwd: /home/sxtnl/dev/smartout.ai
  git_branch: development
  url: https://app.smartout.ai/dashboard
  components_count: 60+  # WebDayControl + 6 tabs + 4 variant views + supporting cards/dialogs

# Step 2 — Architecture
architecture:
  entry: apps/web/src/app/dashboard/page.tsx (91 lines, dispatcher)
  variants:
    - { key: oversikt,            view: WebDayControl,     path: components/day/WebDayControl.tsx, lines: 389 }
    - { key: oversikt-interactive, view: InteractiveDashboard, path: components/dashboard/interactive/, lines: ~ }
    - { key: strategic,           view: StrategicView,     path: components/dashboard/StrategicView.tsx, lines: 479 }
    - { key: reconciliation,      view: ReconciliationView, path: components/dashboard/ReconciliationView.tsx, lines: 715 }
    - { key: activity,            view: ActivityView,      path: components/dashboard/ActivityView.tsx, lines: 98 }
    - { key: todo,                view: TodoTaskView,      path: app/dashboard/_components/todo/TodoTaskView.tsx, lines: 138 }
    - { key: oversikt-pipeline,   view: iframe mockup,     path: /design-mockups/dashboard-pipeline-variants.html }

  webdaycontrol_state_machine:
    - loading       # initial query in flight
    - no-dept       # profile has no department
    - no-session    # dept exists but no session for date
    - ready         # session + dept resolved → renders tabs

  webdaycontrol_tabs:
