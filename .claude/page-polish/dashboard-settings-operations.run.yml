  registered_at: apps/web/src/app/dashboard/settings/operations/_tools/settings-operations-tools-bridge.tsx
  page_key: settings-operations
  read:
    - key: getOperationsSettingsOverview
      desc: "Get the workspace's base operating hours — which days are open and the open/close times. Use when the user asks about opening hours or operational schedule."
    - key: getWorkingTimeRulesSummary
      desc: "Get AML compliance rules — active rules, threshold values, block vs warn severity. Use when the user asks about working time constraints or AML compliance."
    - key: getBreakRulesSummary
      desc: "Get active break rules — trigger types, durations, active count. Use when the user asks about mandatory breaks or pause rules."
