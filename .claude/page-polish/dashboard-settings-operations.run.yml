notes: |
  Read-only summary page. Three parallel TanStack queries (operating hours +
  working time rules + break rules) deduplicate with parent /settings tabs —
  staleTime 10 min on hours, 5 min on payroll schema tables.

  loading.tsx returns null — page skeleton is internal per SectionCard (SkeletonLines
  pulse). This follows the page-polish pattern: a Suspense skeleton cannot branch
  on role or data shape.

  SectionCard ArrowRight links use ?tab= query param to deep-link into parent
  /settings page. The navigateToOperationsSetting tool fires a CustomEvent
  "botsson:navigate-settings-tab" in parallel — parent layout can subscribe if needed.

  ADR-0238: No in-page chat surface. owns_chat_surface = false. Orb interactive mode.

  baseline_blockers:
    lighthouse_lcp_under_1500ms: requires dev server + browser session
    retest_improved: same blocker
