server_actions: []  # No backend yet — all writes are local upserts via store.ts

create_entry_points:
  - { tab: calendar,   ui: ?new=event URL param + slot click + EventSheet,   action: upsertEvent (local) }
  - { tab: calendar,   ui: day click,                                        action: openDayInDayControl (DayControlSheet) }
  - { tab: events,     ui: + button → EventSheet,                             action: upsertEvent (local) }
  - { tab: bookings,   ui: ?new=booking URL param + + button → BookingSheet,  action: upsertBooking (local) }

design:
  zinc_hits: 0           # 0 hardcoded zinc/gray/slate
  motion_token_hits: 0   # 0 raw stiffness/damping
  hardcoded_color_hits: 0  # OKLCH literals only inside EVENT_COLOR_HEX (semantic palette)
  emoji_hits: 0
  skeleton_pattern: |
    page.tsx wraps CalendarPageShell in Suspense with CalendarLoading fallback.
    CalendarPageShell uses AnimatePresence for tab transitions (matches reports
    layout). View toggle uses motionTokens.springSnappy. Layer toggles + tab
    swap fade with motionTokens.easingExpoArray.

page_knowledge:
  header: Kalender
  description: Datoer, sesonger, eventer og bookinger på ett sted
  empty_copy: Ingen eventer eller bookinger registrert. Klikk "+" for å legge til, eller dra i kalenderen for å opprette.
  error_copy: Klarte ikke laste kalender. Lokale endringer er trygt lagret — last siden på nytt.

# Step — Harness tools
harness_tools_current:
  count: 12
  registered_at: apps/web/src/app/dashboard/calendar/_tools/calendar-tools-bridge.tsx
  page_key: calendar
  read:
    - { key: getCalendarState,     desc: "Cursor + view + tab + counts + show-flags. Call first." }
    - { key: getEventsForRange,    desc: "Events between two dates. Range queries." }
    - { key: getBookingsForRange,  desc: "Bookings between two dates." }
    - { key: getEventsForDay,      desc: "Events on a specific date." }
    - { key: getBookingsForDay,    desc: "Bookings + total seat count for a date." }
    - { key: getNextEvents,        desc: "Next N upcoming events from today (1-20)." }
  write_propose:
    - { key: proposeNewEvent,      desc: "Opens EventSheet pre-filled with date+hour. User reviews + saves." }
    - { key: proposeNewBooking,    desc: "Opens BookingSheet. User fills guest+time+seats." }
  navigation:
    - { key: navigateCalendar,     desc: "today | prev | next | date — moves cursor." }
    - { key: switchCalendarView,   desc: "day | week | month (NO aliases: dag | uke | måned)." }
    - { key: switchCalendarTab,    desc: "calendar | year-wheel | events | bookings." }
    - { key: openDayInDayControl,  desc: "Opens DayControlSheet for a specific date." }

