# Step 4 — Speed test (Phase 1 baseline — measured 2026-05-14 prod build on 127.0.0.1:3060)
# Method: Playwright CDP PerformanceObserver (LCP/CLS/INP) + Navigation Timing API (TTI/DCL)
# 3 runs each. Median values recorded. Cold run 1 (1148ms) = true first-load with JIT overhead;
# runs 2-3 (584/540ms) = stable cold. Median cold LCP = 584ms. Warm median = 424ms.
# No pre-fix baseline exists — all values are post-fix prod (verified 2026-05-14).
speed_test:
  cold:  { lcp_ms: 584, cls: 0.001, tti_ms: 388, inp_ms: 52, js_bundle_kb: 916 }
  warm:  { lcp_ms: 424, cls: 0.001, tti_ms: 165, inp_ms: 40, js_bundle_kb: 916 }
  runs:
    - { run: 1, cold_lcp: 1148, warm_lcp: 520, note: "true cold — JIT compilation overhead included" }
    - { run: 2, cold_lcp: 584,  warm_lcp: 424, note: "stable cold" }
    - { run: 3, cold_lcp: 540,  warm_lcp: 332, note: "stable cold" }
  note: "prod-build, 127.0.0.1:3060, Playwright CDP. Median of 3 runs. No pre-fix baseline — all post-fix."
bottlenecks:
  # No client-mount queries to defer (RSC handles all data). No heavy sub-view eager imports
  # found in static analysis — 19 components, none are next/dynamic candidates at this scale.
  # If LCP > 1500ms once measured: investigate next/image priority on avatars first.

