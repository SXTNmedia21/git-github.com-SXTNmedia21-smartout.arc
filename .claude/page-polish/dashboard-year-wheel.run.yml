# Notes
notes:
  owns_chat_surface_recommendation: false   # ADR-0238 — year-wheel is NOT a chat surface; BotssonShell normal mode
  adr_0151_compliance: |
    Both activateSeasonAction and archiveSeasonAction resolve workspace_id + profile_id
    server-side via resolveCurrentProfile() — tool body passes only season_id (entity reference).
    No workspace_id in tool call body. Fully compliant with ADR-0151.
  adr_0238_finding: |
    /dashboard/year-wheel has no embedded domain chat textbox.
    BotssonShell operates in normal interactive mode.
    No <DomainChatOwnership> required.
  telemetry_audit: |
    Server Actions used by write tools:
    1. activateSeasonAction — emits: season activation_failed (gate deny/validation/rpc_error),
       season archived (displaced active season), season activated (success),
       season operating_hours_generated (when rows_newly_inserted > 0).
       All emit() calls verified present in source. Fully compliant.
    2. archiveSeasonAction — emits: season archived (success path only, not idempotent branch).
       Verified per ADR-0200 Invariant 3.
  motion_token_debt:
    - file: apps/web/src/app/dashboard/year-wheel/_components/canvas/TimelineBlock.tsx
      line: 34
      pattern: "{ type: 'spring', stiffness: 35, damping: 22, mass: 2.2 }"
      status: open — should migrate to motionTokens.spring
    - file: apps/web/src/app/dashboard/year-wheel/_components/SeasonActivationProposalModal.tsx
      line: 127
      pattern: "{ type: 'spring', stiffness: 35, damping: 22, mass: 2.2 }"
      status: open — should migrate to motionTokens.spring
  cascade_vocabulary: |
    D4 (demand signal): seasons carry season_budget, day_factor, hour_factor, planning_event.
    D5 (service concept): season activation feeds niche parameters + workspace operating model.
    Year-wheel is the canonical D4/D5 authoring surface in the dashboard.
    Mentioned explicitly in tool descriptions for getYearWheelState, listSeasons, listPlanningEvents.
