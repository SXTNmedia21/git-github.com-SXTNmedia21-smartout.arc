# Step 7 — Page Knowledge
page_knowledge:
  header: "Årshjul"
  description: "Planlegg og visualiser alle sesonger i ett blikk — tegn sesonger på lerretet, sett D4 budsjetter og faktorer, og aktiver den neste sesongen."
  empty_copy: "Ingen sesonger ennå. Klikk og dra i lerretet for å tegne din første sesong."
  error_copy: "Klarte ikke laste sesonger — sjekk tilkoblingen og last siden på nytt."

# Step 8 — Harness tools (7 tools)
harness_tools:
  - key: getYearWheelState
    description: "Get the year wheel's current state — displayed year, active season name, sidebar filter, total season and planning event counts. Call first when answering open-ended questions about the season calendar (D4 demand signal surface)."
    parameters: {}
  - key: listSeasons
    description: "List seasons for the current workspace, optionally filtered by status (active/draft/archived). Use when user asks 'hvilke sesonger finnes?', 'vis utkast', or 'hva er den aktive sesongen?'. Seasons are the D4/D5 authoring unit — they carry revenue budget, day factors, and hour factors."
    parameters: { status: "string (optional)" }
  - key: getSeasonDetail
    description: "Get full detail for a specific season — dates, status, whether D1 operating-hours have been seeded, and a short activation-readiness note. Use when user asks about a specific season by name or when proposing to activate/archive one."
    parameters: { season_id: "string (required)" }
  - key: listPlanningEvents
    description: "List D4 planning events visible in the current year — holidays, campaigns, demand peaks. Use when user asks 'hva skjer i høst?', 'vis hendelser i desember', or needs context for season demand planning."
    parameters: { category: "string (optional)" }
  - key: getSeasonProgress
    description: "Check activation readiness for a draft season — returns whether budget, day factors, and hour factors are configured (D4 completeness). Use when user asks 'kan jeg aktivere [sesong]?' or 'hva mangler for å aktivere?'."
    parameters: { season_id: "string (required)" }
  - key: proposeActivateSeason
    description: "Activate a draft season — calls the server action, archives the currently active season atomically, and seeds D1 operating hours fanout. Use when user explicitly says 'aktiver [sesong]' or confirms activation after getSeasonProgress. Requires the season to have budget + day factors + hour factors set."
    parameters: { season_id: "string (required)" }
  - key: proposeArchiveSeason
    description: "Archive a season (draft or active → archived). Use when user says 'arkiver [sesong]' or wants to move a draft to archived state. Idempotent — safe to call on already-archived seasons."
    parameters: { season_id: "string (required)" }

