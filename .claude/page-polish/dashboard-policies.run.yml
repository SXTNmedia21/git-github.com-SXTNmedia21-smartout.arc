notes: |
  Policies = D3-layer authoring surface (policy → protocol relationship).
  Server-rendered initialData via RSC shell + revalidatePath on mutation.
  No TanStack Query on this page — server re-render is the cache invalidation.
  Detail view (openPolicyDetail nav) is a no-op in Phase 1 — detail route
  does not yet exist. Tool returns found: true with policy summary so Botsson
  can still answer questions about a specific policy.

  proposeCreatePolicy supports optional type pre-selection — openCreateDialog
  callback sets dialogPolicyType state before opening the dialog. PolicyCreateDialog
  does not yet consume this prop (Phase 1 constraint); the type is stored for
  future wiring when the dialog gains a controlled `initialType` prop.

  Bridge mounted at the bottom of PoliciesPageClient render tree.
  owns_chat_surface = false (ADR-0238 — no in-page chat, Orb stays default).
