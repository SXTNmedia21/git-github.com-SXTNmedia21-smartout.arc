# Step 1 — Locate
locate:
  pwd: /home/sxtnl/dev/smartout.ai
  git_branch: development
  url: https://app.smartout.ai/dashboard/notifications
  components_count: 2  # page.tsx + loading.tsx (no _components/_hooks/_actions dirs)

# Step 2 — Architecture
architecture:
  entry: apps/web/src/app/dashboard/notifications/page.tsx (262 lines, "use client")
  loading_fallback: apps/web/src/app/dashboard/notifications/loading.tsx (22 lines)
  shell:
    container: max-w-2xl, p-6 — single-column reading layout
    header: h1 (font-heading text-2xl) + unread-count pill + "Marker alle som lest" button
    filters: 9 filter buttons (rounded-full pills) — all/unread/shift/chat/task/deviation/approval/training/contract
    list: ul of buttons, infinite scroll via IntersectionObserver
  state_machine:
    - loading       # Suspense → loading.tsx
    - empty         # notifications.length === 0 → centered Bell + i18n string
    - ready         # notifications rendered, sentinel triggers fetchNextPage
  variants: []      # No isAdminMode branch — single role experience

skills_loaded:
  - smartout-page-polish
  - smartout-database-guide

# Step 4 — Datapoints (TanStack hooks from @smartout/notifications/client)
datapoints:
  - { name: notifications,    hook: useNotifications,    type: infiniteQuery, params: "{profileId, filter}" }
  - { name: unread_count,     hook: useUnreadCount,      type: query,         params: "{profileId}" }

server_actions: []  # No Server Actions — uses TanStack mutations to API routes
mutations:
  - { name: markAsRead,       hook: useMarkAsRead,       fired_in: "handleRowClick (row click on unread row)" }
  - { name: markAllAsRead,    hook: useMarkAllAsRead,    fired_in: "Marker alle som lest button" }

create_entry_points: []  # Read-only surface — no create flows. Notifications generated server-side via engine_event.

# Step 5 — Design pass (Phase 4)
design:
  zinc_hits: 0          # 0 hardcoded zinc/gray/slate (page.tsx + loading.tsx)
  motion_token_hits: 0  # No motion at all — uses Suspense + plain CSS transitions
  hardcoded_color_hits: 0
  emoji_hits: 0
  font_heading_used: true   # h1 uses font-heading
  font_mono_used: false     # No data-density requiring mono — acceptable for narrative list
  semantic_tokens:
    bg-muted: 4 hits   # skeleton + icon backdrop
    text-foreground: 2 hits
    text-muted-foreground: 4 hits
    bg-destructive: 1 hit (unread badge)
    bg-primary: 1 hit (unread dot)
    border: 1 hit (row outline)
  skeleton_pattern: |
    Suspense fallback (loading.tsx) — no AnimatePresence crossfade. Skeleton
    dimensions match real content row (h-8 icon backdrop, h-4/h-3 text bones,
    rounded-lg border container). Crossfade-flash audit needed in browser
    (Phase 1) but static dimensions match.
  finding: clean_phase_4

# Step 5 — Telemetry audit (incomplete — check API routes)
telemetry:
  files_touched: 1   # page.tsx (no inline emit calls)
  emit_in_page_file: 0
  expected_emit_per_mutation: |
    markAsRead + markAllAsRead are TanStack mutations targeting an API route
    (likely /api/notifications/[id]/read + /api/notifications/read-all).
    emit() should fire server-side in those route handlers.
  audit_required:
