# Step 7 — Harness tools — CURRENT STATE
harness_tools_current:
  count: 0
  registered_at: null
  finding: |
    NO useRegisterTools call. Botsson cannot answer "har jeg uleste varsler?",
    cannot mark-all-read for the user, cannot filter by type. Notifications is
    a high-frequency consumer touchpoint — this is a real gap.

# Step 7 — Harness tools — PROPOSED REGISTRY (next sortie)
harness_tools_proposed:
  page_key: notifications
  read_tools:
    - { key: getNotificationsState,
        description: "Get current notifications state — unread count, active filter, total visible. Call first when user asks anything about varsler.",
        params: {},
        backed_by: [useNotifications, useUnreadCount] }
    - { key: getUnreadNotifications,
        description: "List unread notifications. Use when user asks 'har jeg noe nytt?' or 'hva må jeg lese?'.",
        params: {limit: optional 1-50},
        backed_by: [useNotifications with unreadOnly] }
    - { key: getNotificationsByType,
        description: "Filter notifications by type (shift/chat/task/deviation/approval/training/contract). Use when user narrows scope ('vis bare vakt-varsler').",
        params: {type: required},
        backed_by: [useNotifications with iconType] }
  write_tools:
    - { key: markAllNotificationsRead,
        description: "Mark every unread notification as read. Use when user says 'fjern alle' / 'merker alle som lest' / 'jeg har sett alt'.",
        params: {},
        action: useMarkAllAsRead,
        authority: "self-scoped — no C4 gate (user owns own notifications)" }
  navigation_tools:
    - { key: switchNotificationsFilter,
        description: "Switch active filter tab — all|unread|shift|chat|task|deviation|approval|training|contract.",
        params: {filter: required},
        scope: client-only setActiveFilter }

