# Section 7 — Harness tools — SHIPPED
harness_tools_current:
  count: 9
  scope: shift-clock
  bridge_files:
    - apps/web/src/app/dashboard/shift-clock/_tools/use-shift-clock-tools.ts
    - apps/web/src/app/dashboard/shift-clock/_tools/shift-clock-tools-bridge.tsx
  registered_tools:
    - key: getShiftClockState
      type: read
      note: current phase (idle | clocked_in | on_break | summary) + shiftId + timeEntryId
    - key: getCurrentShift
      type: read
      note: active shift details — punchInTime, elapsed minutes, break count
    - key: getTodayHours
      type: read
      note: total_minutes, break_minutes, work_minutes for current shift
    - key: getBreakStatus
      type: read
      note: isOnBreak, currentBreakMinutes, completedBreaksCount, totalCompletedBreakMinutes
    - key: proposePunchIn
      type: write-propose
      note: dispatches botsson:shift-clock:punch-in CustomEvent; only valid in idle phase
    - key: proposePunchOut
      type: write-propose
      note: dispatches botsson:shift-clock:punch-out CustomEvent; only valid in clocked_in phase
    - key: proposeStartBreak
      type: write-propose
      note: dispatches botsson:shift-clock:start-break CustomEvent; only valid in clocked_in phase
    - key: proposeEndBreak
      type: write-propose
      note: dispatches botsson:shift-clock:end-break CustomEvent; only valid in on_break phase
    - key: switchClockTab
      type: nav
      note: dispatches botsson:shift-clock:switch-tab CustomEvent; valid tabs — tasks, chat, notes
      params: [tab]

