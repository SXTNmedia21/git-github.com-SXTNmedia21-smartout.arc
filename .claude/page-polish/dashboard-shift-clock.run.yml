# Notes
notes: |
  ADR-0133 MOBILE-CRITICAL: shift-clock is the primary D6 employee execute surface.
  "Web composes, mobile executes" — this page hosts the punch-clock execute verbs.
  Botsson voice/chat can read all shift state and propose all phase transitions.

  Harness bridge shipped 2026-05-14.
  9 tools: 4 read + 4 write-propose + 1 nav.
  Tools use dataRef pattern — definitions stable (useMemo []), implementations read live state.
  Write-propose tools dispatch CustomEvents only — UI owns mutation confirmation.
  Phase guard in each propose tool prevents invalid transitions (e.g. punch-out while on break).

  Bridge mount strategy: useShiftClock() called at page level (lifts state); TanStack Query
  deduplicates the activeEntry fetch so ShiftClockView retains its own internal hook call.
  Both hook instances share the same queryKey — zero double-fetch overhead.

  ADR-0151 compliant: workspace_id + profile_id are auth-derived from DashboardContext.
  ADR-0238: owns_chat_surface=false — Orb runs in interactive mode.
  access: employee, manager, admin, owner.
  No switchClockTab listener wired yet in ShiftClockView — coordinator follow-up to add
  window.addEventListener("botsson:shift-clock:switch-tab") in ShiftClockView + pass
  externally controlled activeTab prop for full nav tool round-trip.
