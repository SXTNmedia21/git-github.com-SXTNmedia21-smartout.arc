  - { method: GET, path: /rest/v1/schedule_shift, role: admin+manager, used_by: useShifts }
  - { method: GET, path: /rest/v1/schedule_absence, role: admin+manager, used_by: useAbsences/usePendingAbsences }
  - { method: GET, path: /rest/v1/profile, role: admin+manager, used_by: useEmployees }
  - { method: GET, path: /rest/v1/schedule_shift_swap, role: admin+manager, used_by: useShiftSwap }
  # Mutations all go via Supabase JS client — RLS enforces workspace_id

