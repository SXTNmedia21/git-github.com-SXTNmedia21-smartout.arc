# Step 5 — Datapoint mapping (high-level)
datapoints:
  - { name: shifts, source_table: schedule_shift, hook: useShifts, type: query }
  - { name: open_shifts, source_table: schedule_shift, hook: useOpenShifts, type: query }
  - { name: absences, source_table: schedule_absence, hook: useAbsences, type: query }
  - { name: pending_absences, source_table: schedule_absence, hook: usePendingAbsences, type: query }
  - { name: employees, source_table: profile, hook: useEmployees, type: query }
  - { name: employee_roster, source_table: profile, hook: useEmployeeRoster, type: query }
  - { name: hours_overrides, source_table: department_hours_override, hook: useHoursOverrides, type: query }
  - { name: shift_swaps, source_table: schedule_shift_swap, hook: useShiftSwap, type: query }
  - { name: templates, source_table: schedule_template, hook: useTemplates, type: query }
  - { name: settlement, source_table: shift_approval, hook: useSettlement, type: query }
  - { name: planned_hours, source_table: schedule_shift (derived), hook: usePlannedHours, type: query }
  - { name: schedule_budget, source_table: workspace_budget, hook: useScheduleBudget, type: query }
  - { name: day_content, source_table: department_session, hook: useDayContent, type: query }
  - { name: day_info, source_table: department_session, hook: useDayInfo, type: query }
  - { name: audit_log, source_table: activity_trail, hook: useAuditLog, type: query }

# Step 6 — API routing
api_routes:
  - { method: GET, path: /rest/v1/schedule_shift, role: admin+manager, used_by: useShifts }
  - { method: GET, path: /rest/v1/schedule_absence, role: admin+manager, used_by: useAbsences/usePendingAbsences }
  - { method: GET, path: /rest/v1/profile, role: admin+manager, used_by: useEmployees }
  - { method: GET, path: /rest/v1/schedule_shift_swap, role: admin+manager, used_by: useShiftSwap }
  # Mutations all go via Supabase JS client — RLS enforces workspace_id

