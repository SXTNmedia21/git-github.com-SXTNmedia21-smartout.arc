# Page Polish Run — generated by smartout-page-polish skill
# Per-page YAML worksheet. Every field required before verified: true.
# Filename convention: <route-slug>.run.yml (e.g. dashboard-season.run.yml)

route: null                   # /dashboard/<page>
status: in_progress           # in_progress | verified | failed
verified: false               # blocks commit until true (pre-commit hook enforces)
started_at: null              # ISO8601
verified_at: null             # ISO8601 — set when verified flips true

# Step 1 — Locate
locate:
  pwd: null                   # absolute path of repo root
  git_branch: null
  url: null                   # full url incl subdomain
  components_count: null      # int — count of .tsx files under route

# Step 2 — Walkthrough (BEFORE skills loaded)
walkthrough:
  pages_walked: []            # list of routes traversed
  visual_notes: ""

# Step 3 — Skills loaded
skills_loaded: []             # [smartout-nordic-split, smartout-page-polish, ...]

# Step 4 — Speed test + bottleneck hunt (parallel)
speed_test:
  cold:  { lcp_ms: null, cls: null, tti_ms: null, inp_ms: null }
  warm:  { lcp_ms: null, cls: null, tti_ms: null, inp_ms: null }
bottlenecks: []
  # - { type: skeleton_flash, file: path, line: int, fix: short }

# Step 5 — Datapoint mapping
datapoints: []
  # - { name: shifts, source_table: schedule_shift, hook: useShifts, type: query }

# Step 6 — API routing (cross-ref with docs/reference/ROUTES.md)
api_routes: []
  # - { method: GET, path: /api/shifts, role: admin, used_by: useShifts }

# Step 7 — Page Knowledge fields (also written to page_knowledge table)
page_knowledge:
  header: null                # one short noun phrase
  description: null           # one sentence — what this page is FOR
  empty_copy: null            # what user is missing + next action
  error_copy: null            # what failed + what to try

# Step 8 — Harness tools
harness_tools: []
  # - { key: filterShifts, description: "Use when user asks to narrow schedule", parameters: {} }

# Step 9 — Design pass (after fixes)
design:
  zinc_hits: null             # int — must be 0
  motion_token_hits: null     # int — must be 0
  hardcoded_color_hits: null  # int — must be 0

# Step 10 — Re-test
retest:
  cold:  { lcp_ms: null, cls: null }
  warm:  { lcp_ms: null, cls: null }
  improved: null              # bool — must be true vs step 4

# Step 11 — Verification checklist
checklist:
  lighthouse_lcp_under_1500ms: false
  no_skeleton_flash: false
  motion_tokens_used: false
  telemetry_emit_per_mutation: false
  page_knowledge_written: false
  page_knowledge_db_synced: false
  harness_tools_registered: false
  retest_improved: false
