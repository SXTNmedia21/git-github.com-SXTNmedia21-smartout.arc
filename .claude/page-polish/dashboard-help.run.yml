# Step 11 — ADR-0238 Surface Disambiguation
adr_0238:
  owns_chat_surface: true
  domain_chat_endpoint: /api/botsson/chat
  domain_chat_ownership_declared: false
  reason: |
    DomainChatOwnership component (ADR-0238) is not yet implemented in the codebase.
    ADR-0238 status: proposed (not accepted/shipped). BotssonChatHero.tsx mounts its own
    BotssonProvider (isolates session from Orb), which is a partial mitigation.
    The Orb (BotssonShell via EmmaOverlay in DashboardShell) remains interactive on this page.
    This is a P2 UX issue (not P0 — no silent misroute, sessions are independent).
    Escalated to lead-agent. Requires BotssonProvider.tsx + BotssonShell.tsx changes.
    Reference: LonnsprofilSection.tsx:27 also awaits this component.

