# Step 8 — Harness tools
harness_tools:
  # Key "help" via HelpVoiceToolsBridge → useHelpVoiceFallbackKit
  - { key: kb_query_voice_fallback, description: "Call this tool when the user asks about handbook content, policies, procedures, rules, routines, or any knowledge base question via voice. This capability is only available in chat — voice cannot answer KB queries. After calling this tool, speak the returned message verbatim.", parameters: {} }
  # Key "help-tour" via HelpTourToolsBridge → useHelpTourKit
  - { key: "ui.navigate_to", description: "Smooth-scroll the /dashboard/help page to a known anchor (panic_bar, chat_hero, active_ticket_badge, quick_paths, curated_articles, kontakt_footer). Returns ok+scrolled_to on success or ok=false+reason on failure.", parameters: { target_id: string } }
  - { key: "ui.highlight_element", description: "Render an outline overlay and label badge on a known anchor on /dashboard/help. Auto-dismisses after duration_ms (default 5000 ms). Returns ok+highlighted on success or ok=false+reason on failure.", parameters: { target_id: string, label: string, duration_ms: "integer (optional)" } }
  # Key "help-takeover" via HelpTakeoverToolsBridge → useHelpTakeoverKit
  - { key: "ui.simulate_click", description: "Propose a click on an allow-listed UI element on /dashboard/help. ALWAYS shows a preview overlay with a 3-second confirm-delay BEFORE clicking. User must confirm. ESC cancels. Returns ok+state='previewing' immediately or ok=false+reason if denied.", parameters: { target_id: string } }
  - { key: "ui.submit_form", description: "STUB in v1 — no forms are allow-listed yet. Always returns ok=false with reason='no_forms_in_v1_allowlist'. Future versions will let Botsson fill + submit named forms via preview-confirm flow.", parameters: { form_id: string, field_values: object } }
  - { key: "ui.wait_for_state", description: "Wait until a known DOM predicate is met on /dashboard/help. Allow-listed predicates: panic_drawer_open, panic_drawer_closed. Returns ok+met=true+elapsed_ms when satisfied, ok+met=false+elapsed_ms on timeout. Read-only — no mutation.", parameters: { predicate: string, timeout_ms: "integer (optional)" } }

