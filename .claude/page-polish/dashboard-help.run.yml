    - /dashboard/help (five-tier RSC page)
  visual_notes: |
    Five-tier RSC shell (ADR-0219). Tier 0: PanicBar (sticky, client, 56px).
    Tier 0.5: ActiveTicketBadge (server, conditional on activeThreads.length >= 1).
    Tier 1: BotssonChatHero (client, BotssonProvider + BotssonChat, max-h-[480px]).
    Tier 2: QuickPathCards (server, role-filtered 2x2 grid).
    Tier 3: CuratedArticlesList (server, 5 static KB articles).
    Tier 5: KontaktFooter (server, 3 contact channels + status badge).
    Three tool bridges at page root: HelpVoiceToolsBridge, HelpTourToolsBridge, HelpTakeoverToolsBridge.
    No framer-motion in route tree. No skeleton flash risk (loading.tsx matches five-tier layout).
    ADR-0238 dual-surface risk: BotssonChatHero has own BotssonProvider (isolated session);
    DomainChatOwnership component not yet implemented (ADR-0238 proposed, not shipped).
    Code fix: bg-emerald-500 → bg-primary in KontaktFooter.tsx (hardcoded color removal).

