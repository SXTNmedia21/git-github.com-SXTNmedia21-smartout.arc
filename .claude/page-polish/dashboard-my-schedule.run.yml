# Access
access: ["employee", "manager", "admin", "owner"]

# Notes
notes: |
  employee schedule view is read-only (D6 production surface — shifts are published by
  managers, not authored by employees). Tools give Botsson full read access:
  - getMySchedule: current week overview (most common entry)
  - getNextShift: single most urgent answer for shift workers
  - getMyShifts: range query (tells Botsson to navigate first if range not loaded)
  - navigateWeek: lets Botsson drive week navigation for voice commands

  weekOffset state lifted from MyWeekView to page.tsx so bridge + view share
  one TanStack cache entry (same queryKey). No duplicate fetch.

  MyWeekView supports both controlled mode (page.tsx passes weekOffset + onWeekOffsetChange)
  and standalone mode (no props — manages offset internally). Backwards compatible.

  Next sortie order:
  1. Phase 1 Lighthouse baseline (cold + warm LCP/CLS/TTI).
  2. Phase 6: error.tsx + stronger empty-state copy + header description upgrade.
  3. Phase 8: site-map.json entry for /dashboard/my-schedule.
  4. Consider: proposeRequestAbsence tool when absence request mutations land in actions.ts.
