# Step 8 — Harness tools (REGISTERED 2026-04-29)
harness_tools:
  registered_count: 8
  source_key: "komm"
  bridge_file: "apps/web/src/app/dashboard/komm/_tools/komm-tools-bridge.tsx"
  hook_file: "apps/web/src/app/dashboard/komm/_tools/use-komm-tools.ts"
  mounted_in:
    - "_components/KanalerClient.tsx (surface=channels, activeChannelId=client state)"
    - "_components/ChatClient.tsx (surface=chat, activeChannelId=client state)"
    - "_components/OversiktClient.tsx (surface=channels, activeChannelId=null)"
    - "_components/NyheterClient.tsx (surface=channels, activeChannelId=null)"
    - "thread/[channelId]/_components/TicketConversationView.tsx (surface=chat, activeChannelId=URL channel_id)"
  coverage:
    /dashboard/komm: full (8 tools, active-channel-aware)
    /dashboard/komm/chat: full (8 tools, active-channel-aware)
    /dashboard/komm/oversikt: read tools work, action tools fail-fast on null channel
    /dashboard/komm/nyheter: read tools work, action tools fail-fast on null channel
    /dashboard/komm/thread/[channelId]: full (8 tools, channelId pinned from URL)
  registered_tools:
    # Read tools (5)
    - { key: listChannels, kind: read, description: "List all channels the user can see, grouped by type." }
    - { key: getActiveChannel, kind: read, description: "Get details of the currently open channel." }
    - { key: getRecentMessages, kind: read, description: "Get the last 20 messages from the active channel." }
    - { key: getUnreadCount, kind: read, description: "Get total unread + per-channel breakdown." }
    - { key: getMyHelpdeskCount, kind: read, description: "Get count of open helpdesk tickets assigned to user." }
    # Action tools (3)
    - { key: sendMessage, kind: action, description: "Post a text message to the active channel. Delegates to useSendMessage (RLS + emit channel.message.sent). Requires active channel." }
    - { key: createChat, kind: action, description: "Create a 1:1 DM with another profile. Delegates to useCreateChannel (RLS + emit channel.created). Returns existing channel if DM already exists." }
    - { key: joinCall, kind: action, description: "Join the active call in a channel — audio (default) or audio+video. Fetches LiveKit token via getLiveKitToken, joins via ActiveCallProvider." }
  deferred_tools:
    - { key: switchChannel, kind: navigation, reason: "needs router-aware bridge prop" }
    - { key: openChat, kind: navigation, reason: "needs router-aware bridge prop" }

