# Step 5 — Datapoint mapping
datapoints:
  - { name: protocols,          source_table: protocol + protocol_assignment, hook: useGovernanceFiltered("all") → useGovernanceOverview, type: query }
  - { name: openDeviations,     source_table: deviation,                     hook: useDeviations({ status: [open,acknowledged,escalated] }), type: query }
  - { name: driftInsights,      source_table: department_session + session_task, hook: useDriftInsights(today), type: query }
  - { name: competenceData,     source_table: protocol_assignment,           hook: useCompetenceData (inside OversiktDashboard), type: query }
  - { name: upcomingReviews,    source_table: protocol_assignment,           hook: inline in OversiktDashboard (not exposed to bridge), type: query }

# Step 6 — Server Actions (ADR-0151 compliance audit)
server_actions:
  - file: _hooks/use-create-deviation.ts → _actions/report-deviation-action.ts
    pattern: Server Action via useMutation wrapper
    workspace_id_source: resolveCurrentProfile() server-side — JWT-derived, not body (ADR-0151 + ADR-0114)
    emit: server-side inside reportDeviationAction (awaited)
    adr_0151_compliant: true

  - file: _hooks/use-update-deviation.ts
    pattern: TanStack useMutation → supabase.from("deviation").update()
    workspace_id_source: NOT in mutation body — deviation_id is the selector; workspace_id filtered by RLS (valid pattern)
    emit: void emit("deviation resolved" | "deviation updated") in onSuccess — uses nonEmpty() guards
    adr_0151_compliant: true
    note: "actor_id from DashboardContext.profileId; workspace_id from useWorkspace. nonEmpty() fails fast on empty string. Compliant."

  - file: _hooks/use-complete-task.ts
    pattern: TanStack useMutation (task completion)
    audit_note: "Not audited in this run — out of scope (drift tab, not oversikt). Flag for drift polish run."

