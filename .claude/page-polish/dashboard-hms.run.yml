# Step 11 — Verification checklist
checklist:
  lighthouse_lcp_under_1500ms: false      # baseline_blocker — requires dev server + browser session
  no_skeleton_flash: true                  # loading.tsx Suspense fallback present; no role-branching flash (HmsPageClient branches after mount, skeleton is neutral)
  motion_tokens_used: false                # bridge files return null — no animation surface; not a blocker for bridge-only run
  telemetry_emit_per_mutation: true        # useCreateDeviation → reportDeviationAction server-side emit (ADR-0114). useUpdateDeviation → void emit() in onSuccess with nonEmpty() guards. Bridge tools are read+nav only — no mutations introduced.
  page_knowledge_written: true
  page_knowledge_db_synced: false          # page_knowledge table insert deferred (out of scope)
  harness_tools_registered: true           # 6 tools registered via useRegisterTools("hms", ...)
  retest_improved: false                   # baseline_blocker — same blocker as lighthouse

notes: |
  Scope: ONLY the root /dashboard/hms page (oversikt tab) + bridge.
  Sub-routes (deviations/documents/drift/governance) are separate polish runs.
  Governance bridge already shipped at commit 5e23c836e — NOT touched here.

  Bridge mount rationale: HmsToolsBridge mounted in HmsPageClient (client boundary),
  NOT in layout.tsx. Reason: layout.tsx is a Server Component and wraps ALL 6 sub-routes.
  Mounting in layout would cause double-mount on /hms/governance (governance bridge also
  registers "governance" scope on that sub-route). By mounting only in hms-page-client.tsx
  (root index page), the "hms" scope registers only when the root oversikt tab is active.

  Data cost: HmsToolsBridge reuses 3 TanStack queries already fired by OversiktDashboard
  (useGovernanceFiltered, useDeviations, useDriftInsights). Zero extra network requests —
  all data from shared TanStack cache.

  upcomingReviewCount gap: The inline query in OversiktDashboard is not extracted into a
  named hook. Bridge exposes 0 for this field. Full fix = extract to use-upcoming-reviews.ts
  (planned for oversikt polish run when full page refactor is in scope).

  ADR-0151 compliance:
    - useCreateDeviation → reportDeviationAction: workspace_id JWT-derived server-side ✓
    - useUpdateDeviation: mutation selects by deviation_id; RLS enforces workspace_id boundary ✓
    - Bridge tools: no mutations — read + router.push() only ✓

  Motion-token debt:
    - bridge files: none (return null)
    - OversiktDashboard.tsx: no framer-motion — uses plain Tailwind transitions. TODO for UI polish run.

  baseline_blockers:
    lighthouse_lcp_under_1500ms: requires dev server + browser session
    retest_improved: same blocker
    motion_tokens_used: bridge files return null — no animation surface; not a real blocker.
