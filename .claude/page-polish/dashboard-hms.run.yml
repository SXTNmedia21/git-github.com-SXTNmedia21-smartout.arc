  header: HMS
  description: "Samlet HMS-oversikt — åpne avvik, regelverksstatus og driftssesjoner for arbeidsplassen din."
  empty_copy: "Ingen aktive protokoller ennå. Gå til Governance-fanen for å opprette policyer og tildele opplæring."
  error_copy: "Klarte ikke laste HMS-data. Sjekk nettverkstilkoblingen og last siden på nytt."

# Step 8 — Harness tools
harness_tools_current:
  count: 6
  registered_at: apps/web/src/app/dashboard/hms/_tools/hms-tools-bridge.tsx
  bridge_mount: apps/web/src/app/dashboard/hms/_components/hms-page-client.tsx
  page_key: hms
  read:
    - key: getHmsOverview
      desc: "Get the HMS umbrella KPI summary — governance readiness %, total protocols, overdue protocol count, upcoming reviews (next 30 days), open deviation count, and blocking deviation count. Call first when manager asks any open-ended HMS status question like 'hvordan er HMS i dag?' or 'er alt greit?'."
    - key: listOpenDeviations
      desc: "List open, acknowledged, and escalated C4-layer deviations with severity, domain, and department. Use when manager asks 'hvilke avvik er åpne?', 'er det noen blokkerende avvik?', or wants to see current deviation status."
    - key: listOverdueProtocols
      desc: "List D3-layer protocols that have expired assignments — employees whose certification has lapsed. Use when manager asks 'hvem er utgått på opplæring?', 'hvilke protokoller er overdue?', or needs compliance gap overview."
    - key: getDriftStatus
      desc: "Get today's D6-layer session stats — active/closed/missed session counts, task completion %, overdue tasks, and blocking deviations. Use when manager asks 'hvordan går driften i dag?', 'er det noen sesjoner som ikke er lukket?'."
  navigation:
    - key: switchHmsTab
      desc: "Navigate to one of the 6 HMS sub-tabs: oversikt | drift | training | documents | deviations | governance. Use when manager says 'gå til avvik', 'åpne opplæring', 'vis dokumenter', 'vis drift', or 'gå til governance'."
    - key: focusDeviation
      desc: "Navigate to the deviations tab. Optionally pass a deviation ID to bring that deviation into focus. Use when manager asks about a specific avvik or says 'åpne avvik X'."

