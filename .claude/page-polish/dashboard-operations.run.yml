# Phase 7 — Harness tools
harness_tools_current:
  count: 5
  registered_at: apps/web/src/app/dashboard/operations/_tools/operations-tools-bridge.tsx
  page_key: operations
  read:
    - key: getOperationsOverview
      desc: "Live KPI summary for today — task %, stress, staff, deviations, HACCP, cleaning, labor-cost flag. Call first on any drift question."
    - key: getStressBreakdown
      desc: "Per-department staff capacity — present vs expected + capacityPct per dept. Use when manager asks which dept is most understaffed."
    - key: getActiveDeviations
      desc: "Open/acknowledged deviations with severity breakdown (critical/high/medium/low). Use when manager asks about operational risk."
    - key: getTaskStatus
      desc: "Session task progress — done/overdue/in-progress/upcoming counts. Use when manager asks if the shift is on schedule."
    - key: getHourlyChart
      desc: "Hourly revenue vs labor cost for today's chart window. Use when manager asks about cost efficiency or revenue-to-cost ratio."
  write_propose: []  # No write tools — DeviationDialog is user-driven; Botsson directs user to the button

speed_test:
  cold:  { lcp_ms: null, cls: null, tti_ms: null, inp_ms: null }
  warm:  { lcp_ms: null, cls: null, tti_ms: null, inp_ms: null }

checklist:
  lighthouse_lcp_under_1500ms: false   # baseline_blocker — requires browser session
  no_skeleton_flash: true              # loading.tsx returns null-compatible skeleton; page has internal loading state
  motion_tokens_used: false            # existing raw springs in DepartmentBreakdown — deferred to Phase 4 sortie
  telemetry_emit_per_mutation: true    # DeviationDialog emits on onSuccess
  page_knowledge_written: true
  page_knowledge_db_synced: false
  harness_tools_registered: true       # 5 tools live
  retest_improved: false               # blocked — requires browser session

notes: |
  Operations page is a "use client" component — all data fetching via TanStack
  Query (useOperationsData). 9 Supabase queries run in parallel (Promise.all).
  Refetch every 3 min (60s staleTime). No Server Actions.

  Harness bridge mounted at line 117 of page.tsx (inside outer div, before header).
  deptMetrics passed as [] — DepartmentBreakdown owns its own query; bridge tool
  reflects this via "Klikk på stresskort-panelet" message when breakdown not loaded.

  ADR-0238: No in-page chat surface. owns_chat_surface = false. BotssonShell
  renders in normal interactive mode. No DomainChatOwnership declaration needed.

  Phase 4 design debt (existing, not introduced):
  - DepartmentBreakdown.tsx: raw stiffness/damping springs + orange-500 hardcoded.
  These predate this polish run and are tracked for a dedicated design sortie.

  baseline_blockers:
    lighthouse_lcp_under_1500ms: requires dev server + browser session
    retest_improved: same blocker
    motion_tokens_used: deferred to Phase 4 design sortie (DepartmentBreakdown.tsx)
