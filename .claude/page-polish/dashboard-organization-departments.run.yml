# ─────────────────────────────────────────────
# Phase 7 — Harness tool expectations
# ─────────────────────────────────────────────
phase_7:
  status: done
  scope: organization-departments
  files:
    - apps/web/src/app/dashboard/organization/departments/[id]/_tools/use-departments-tools.ts
    - apps/web/src/app/dashboard/organization/departments/[id]/_tools/departments-tools-bridge.tsx
  tools:
    - name: getDepartmentSummary
      description: >
        Get a summary of the current department — name, active/inactive status,
        position count, team count, member count, policy count, and manager name.
        Use when the user asks 'hva er status på denne avdelingen?', 'hvem leder
        avdelingen?', 'hvor mange ansatte er her?', or wants a quick overview.
    - name: listPositions
      description: >
        List all positions defined in this department with their active status,
        minimum role requirement, and description. Use when the user asks 'hvilke
        stillinger finnes her?', 'vis stillinger i avdelingen', 'er [stilling] aktiv?',
        or needs to review staffing structure.
    - name: listDepartmentTeams
      description: >
        List all teams linked to this department. Use when the user asks 'hvilke team
        tilhører avdelingen?', 'vis team i [avdeling]', or needs to understand team
        structure within this department.
    - name: getDepartmentOperatingHours
      description: >
        Get the per-day operating hour offsets for this department relative to workspace
        base hours. Use when the user asks 'når åpner avdelingen?', 'hva er åpningstidene
        her?', 'er det avvik fra arbeidsstedets timer?', or needs to review when this
        department operates.
    - name: openDepartmentEdit
      description: >
        Open the edit dialog for this department so the user can change name, description,
        color, icon, manager, or active status. Use when the user says 'rediger avdelingen',
        'endre navn', 'oppdater avdelingsinfo', or asks to modify department settings.
  adr_refs:
    - ADR-0151  # workspace_id auth-derived, never body-supplied
    - ADR-0238  # no domain chat surface — Orb interactive mode

