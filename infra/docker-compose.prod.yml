# ============================================
# docker-compose.prod.yml — Production overlay
# Adds restart policies, resource limits, and production env.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================

services:
  caddy:
    restart: always

  stage-engine:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  shift-mcp:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  contract-service:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  scrapling:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  n8n:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
