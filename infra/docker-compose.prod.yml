# ============================================
# docker-compose.prod.yml — Production overlay
# Adds restart policies, resource limits, log rotation, and production env.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    restart: always
    logging: *default-logging

  stage-engine:
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:5010:5010"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  shift-mcp:
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:5011:5011"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  contract-service:
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:5012:5012"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  scrapling:
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  voice-agent:
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  n8n:
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:5678:5678"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
