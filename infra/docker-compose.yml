# ============================================
# docker-compose.yml — Smartout Infrastructure (base)
# Defines all services on a shared Docker network.
# Caddy handles HTTPS for external-facing services.
# Override with docker-compose.override.yml (dev) or
# docker-compose.prod.yml (production).
#
# Build context for Node services: monorepo root (../)
# Build context for Python services: service directory
#
# Connected to: ADR-0040 (Infrastructure stays in monorepo)
# ============================================

networks:
  smartout-internal:
    driver: bridge

services:
  # ── Reverse Proxy ─────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - smartout-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - stage-engine
      - shift-mcp
      - contract-service
      - n8n

  # ── Stage Engine (AI agent orchestration) ─────────────────
  stage-engine:
    build:
      context: ../
      dockerfile: services/stage-engine/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=5010
      - ENGINE_URL=${ENGINE_URL}
      - DEV_API_KEY=${STAGE_ENGINE_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - ULTRAVOX_API_KEY=${ULTRAVOX_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SESSION_EXPIRY_HOURS=${SESSION_EXPIRY_HOURS:-24}
      - CLEANUP_INTERVAL_MINUTES=${CLEANUP_INTERVAL_MINUTES:-5}
      - SIXTEN_QUEUE_PATH=${SIXTEN_QUEUE_PATH:-/app/infra/sixten/queue.json}
    networks:
      - smartout-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ../docs/journeys:/app/docs/journeys:ro
      # Sixten task-dispatcher queue (Phase 0.5, ADR-0255 addendum).
      # Read+write: dispatcher.sh on host pops claims; agentQueue route patches status.
      - ../infra/sixten/queue.json:/app/infra/sixten/queue.json

  # ── Shift MCP (schedule management tools for AI) ──────────
  shift-mcp:
    build:
      context: ../
      dockerfile: services/shift-mcp/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=5011
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - smartout-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5011/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Contract Service (DocuSeal e-signatures) ──────────────
  contract-service:
    build:
      context: ../
      dockerfile: services/contract-service/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=5012
      - SERVICE_KEY=${CONTRACT_SERVICE_KEY}
      - NODE_ENV=${NODE_ENV:-development}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DOCUSEAL_API_KEY=${DOCUSEAL_API_KEY}
      - DOCUSEAL_API_URL=${DOCUSEAL_API_URL:-https://api.docuseal.com}
      - DOCUSEAL_WEBHOOK_SECRET=${DOCUSEAL_WEBHOOK_SECRET}
      - SMARTOUT_COMPANY_NAME=${SMARTOUT_COMPANY_NAME:-Smartout AS}
      - SMARTOUT_ORG_NUMBER=${SMARTOUT_ORG_NUMBER:-}
      - SMARTOUT_CONTACT_EMAIL=${SMARTOUT_CONTACT_EMAIL:-pontus@smartout.io}
      - APP_URL=${APP_URL:-https://app.smartout.ai}
    networks:
      - smartout-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5012/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Scrapling (web scraping — internal only) ──────────────
  scrapling:
    build:
      context: ../services/scrapling
      dockerfile: Dockerfile
    environment:
      - PORT=8000
      - SCRAPLING_AUTH_TOKEN=${SCRAPLING_AUTH_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      - SCRAPLING_LOG_DIR=/data
    volumes:
      - scrapling_logs:/data
    networks:
      - smartout-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Voice Agent (LiveKit Agents worker for Mr. Botsson) ───
  # ADR-0135: mobile + worker on LiveKit; web Botsson stays on Ultravox.
  # No HTTP server, no Caddy route — connects outbound to LiveKit cloud
  # and joins rooms via automatic-dispatch.
  voice-agent:
    build:
      context: ../
      dockerfile: services/voice-agent/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - LIVEKIT_URL=${NEXT_PUBLIC_LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STAGE_ENGINE_URL=http://stage-engine:5010
      - BOTSSON_SERVICE_JWT=${BOTSSON_SERVICE_JWT}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - smartout-internal
    restart: unless-stopped
    depends_on:
      - stage-engine

  # ── n8n (workflow automation — not yet deployed) ────────────
  n8n:
    image: n8nio/n8n:2.10.4
    environment:
      - N8N_HOST=${N8N_HOST:-n8n.smartout.ai}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://n8n.smartout.ai/}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Oslo}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - smartout-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
  scrapling_logs:
