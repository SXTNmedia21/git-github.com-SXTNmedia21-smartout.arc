name: Migration Lint

# Static checks on supabase/migrations/ added in the PR.
# Catches: (a) timestamps <= base-ref tip (L-0042), (b) CREATE TABLE IF NOT
# EXISTS in new migrations (anti-pattern per smartout-database-guide), and
# (c) ENUM collisions vs database.types.ts. See:
#   - .github/scripts/migration-lint.sh
#   - docs/audits/2026-05-06-supabase-migration-audit.md (F-DB-04)

on:
  pull_request:
    branches: [main, preview, development]
    paths:
      - "supabase/migrations/**"
      - ".github/scripts/migration-lint.sh"
      - ".github/workflows/migration-lint.yml"
  # Also run on direct pushes (development accepts direct commits per CLAUDE.md).
  # Without this, a direct-push to development bypasses the linter entirely —
  # which is exactly how the ADR-0388 cron fix skipped Check 0 in CI. The
  # cron-coherence check (Check 0) is a working-tree scan and runs regardless
  # of base-ref; the diff-based checks compare against the pre-push SHA.
  push:
    branches: [development, preview, main]
    paths:
      - "supabase/migrations/**"
      - ".github/scripts/migration-lint.sh"
      - ".github/workflows/migration-lint.yml"

jobs:
  lint:
    name: Lint new migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run migration linter
        # PR events compare against the base branch; push events compare against
        # the pre-push SHA (github.event.before). If the base ref is
        # unresolvable (e.g. first push to a new branch), the diff-based checks
        # skip cleanly while Check 0 still runs.
        env:
          GIT_BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || github.event.before }}
        run: bash .github/scripts/migration-lint.sh
