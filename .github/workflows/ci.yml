name: CI

# Force re-parse 2026-04-20: GitHub stuck in startup_failure since 2026-04-09
# after Actions quota exhausted on Free plan. Pro activated 2026-04-20.

on:
  push:
    branches: [main, development, preview]
  pull_request:
    branches: [main, development, preview]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: true

jobs:
  # ── Fast checks (parallel, ~1 min each) ────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Determine base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - name: Format check (changed files only)
        run: |
          set -euo pipefail
          # core.quotepath=false → emit UTF-8 paths raw (no C-octal escapes)
          # so xargs passes correct bytes to prettier (L-format-check-quotepath-fix).
          # Without it, git escapes non-ASCII (§, å) and xargs passes literal
          # backslash-octal strings, prettier fails ENOENT, xargs exits 123.
          FILES=$(git -c core.quotepath=false diff --name-only --diff-filter=ACMR \
            "${{ steps.base.outputs.ref }}"...HEAD \
            -- '*.ts' '*.tsx' '*.md' '*.json' '*.css' || true)
          if [ -z "$FILES" ]; then
            echo "No formattable files changed — skipping prettier."
            exit 0
          fi
          echo "Checking $(echo "$FILES" | wc -l) files:"
          echo "$FILES"
          echo "$FILES" | xargs pnpm exec prettier --check
      - name: CORS pattern gate (ADR-0408)
        # Blocks re-introduction of the deprecated static corsHeaders constant.
        # Any EF file importing corsHeaders from _shared/cors.ts or hardcoding
        # Access-Control-Allow-Origin: https://... fails with exit 1.
        run: pnpm check:cors

      - name: Workspace FK CASCADE check (ADR-0409)
        run: node scripts/check-workspace-fk-cascade.mjs

  # ── Vitest (packages with unit/integration tests) ───────────────
  # Any PR that breaks a capability, hook, or telemetry-registry test blocks merge.
  # Covered by turbo test pipeline: packages/ai, packages/schedule, packages/telemetry,
  # packages/shift-clock, packages/data, packages/utils (where each defines a `test` script).
  # See: PLAN-secure-shift-lifecycle.md WS-B4.
  vitest:
    name: Vitest (packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test

  build-health:
    name: Build Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:health
      - name: Upload build health artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-health-report
          path: artifacts/quality/build-health-report.json

  api-docs-go-live-guard:
    name: API Docs Go-Live Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:docs:verify-go-live

  # ── Docker builds (verify images compile) ────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: stage-engine
            dockerfile: services/stage-engine/Dockerfile
          - name: shift-mcp
            dockerfile: services/shift-mcp/Dockerfile
          - name: contract-service
            dockerfile: services/contract-service/Dockerfile
          - name: scrapling
            dockerfile: services/scrapling/Dockerfile
            context: services/scrapling
          - name: voice-agent
            dockerfile: services/voice-agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service.name }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: |
            docker build \
              -f ${{ matrix.service.dockerfile }} \
              -t smartout/${{ matrix.service.name }}:ci \
              ${{ matrix.service.context || '.' }}

  # ── Build (parallel with checks, no longer waits for typecheck) ─
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all apps
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm turbo run build
      - name: Strip colon-named externalized chunks from build output
        # Next.js writes externalized node: chunks like `[externals]_node:inspector_*.js`
        # to .next/server/chunks/. They reference node: imports that resolve at
        # runtime, so they are never served. The colon character is invalid in
        # GitHub Actions artifact paths — strip them before upload.
        run: |
          find apps/web/.next -name '*node:*' -delete 2>/dev/null || true
          find apps/landing/.next -name '*node:*' -delete 2>/dev/null || true
      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-next-build
          path: apps/web/.next
          include-hidden-files: true
      - name: Upload landing build artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-next-build
          path: apps/landing/.next
          include-hidden-files: true

  # ── ADR-0204 §3 — no inline gate_action RPC ───────────────────
  # Blocks merge if any .ts/.tsx file outside the two allowed call sites
  # (gatedMutation.ts orchestrator + _shared.ts web wrapper) contains a
  # direct supabase.rpc("gate_action", ...) call.
  no-inline-gate-rpc:
    name: ADR-0204 §3 — no inline gate_action RPC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/no-inline-gate-rpc.sh

  # ── Harness invariants (PR-blocking scripts) ───────────────────
  # I2 (emit-registry coverage), I4 (server-derived actor), I6 (gate_action singleton), I10 (intent-classifier coverage).
  # Scripts live in packages/ai/scripts/; see docs/architecture/INVARIANTS.md.
  harness-invariants:
    name: Harness Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartout/ai run invariants:emit-coverage
      - run: pnpm --filter @smartout/ai run invariants:server-actor
      - run: pnpm --filter @smartout/ai run invariants:gate-singleton
      - run: pnpm --filter @smartout/ai run invariants:intent-coverage

  # ── Edge Functions deploy gate (ADR-0262) ──────────────────────
  # On PR with supabase/functions/** changes: dry-run deploy each touched function.
  # On main push: real deploy. Closes the orphan tier — Edge Functions can no
  # longer drift from main without CI catching it.
  edge-functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          # Pinned 2026-05-20 — `latest` resolved to a CLI revision that flags
          # Supabase platform baseline migrations (00001-00013) as orphans,
          # producing false-positive "Remote migration versions not found in
          # local migrations directory" failures on every main push.
          # CLI 2.100.1 correctly filters platform baselines via supabase REST.
          version: 2.100.1
      - name: Detect changed Edge Functions
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            CHANGED=$(git diff --name-only "$BASE"..HEAD -- 'supabase/functions/**' \
              | awk -F/ '{print $3}' | sort -u | grep -vE '^(_shared|$)' || true)
          else
            CHANGED=$(git diff --name-only HEAD~1..HEAD -- 'supabase/functions/**' \
              | awk -F/ '{print $3}' | sort -u | grep -vE '^(_shared|$)' || true)
          fi
          # Collapse to single space-separated line — multi-line values via
          # expression substitution into step-level env: blocks fail GH
          # workflow parser (SMA-audit follow-up after several heredoc attempts).
          CHANGED_ONELINE=$(echo "$CHANGED" | tr '\n' ' ' | sed 's/  */ /g; s/^ //; s/ $//')
          echo "changed=$CHANGED_ONELINE"
          echo "changed=$CHANGED_ONELINE" >> "$GITHUB_OUTPUT"
      - name: Dry-run deploy (PR) or real deploy (main push with [deploy] tag)
        if: steps.detect.outputs.changed != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROD_REF }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          CHANGED: ${{ steps.detect.outputs.changed }}
        run: |
          HAS_DEPLOY_TAG=false
          if echo "$COMMIT_MSG" | grep -q '\[deploy\]'; then
            HAS_DEPLOY_TAG=true
          fi
          # CHANGED is single-line space-separated (see detect step).
          for fn in $CHANGED; do
            if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "$HAS_DEPLOY_TAG" = "true" ]; then
              echo "::group::Deploy $fn"
              supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
              echo "::endgroup::"
            elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::notice::Skipping real deploy of $fn — commit message lacks [deploy] tag"
              echo "::group::Dry-run $fn (main push, no [deploy] tag)"
              supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --dry-run \
                || echo "::warning::dry-run failed for $fn"
              echo "::endgroup::"
            else
              echo "::group::Dry-run $fn"
              supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --dry-run \
                || echo "::warning::dry-run failed for $fn — investigate before merge"
              echo "::endgroup::"
            fi
          done

  # ── Migration deploy (ADR-0262 amendment) ──────────────────────
  # On main push: apply all pending migrations to prod via Supabase CLI.
  # Before push: repair the ghost migration row at 20260503174428 — meta
  # marked applied but RPC function does not exist on prod (verified
  # 2026-05-13). Marking it reverted forces re-apply so CI verify-job can
  # call migration_state_latest() afterwards.
  db-push:
    name: Migration Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned 2026-05-20 — `latest` resolved to a CLI revision that flags
          # Supabase platform baseline migrations (00001-00013) as orphans,
          # producing false-positive "Remote migration versions not found in
          # local migrations directory" failures on every main push.
          # CLI 2.100.1 correctly filters platform baselines via supabase REST.
          version: 2.100.1
      - name: Link, repair ghost migration, push pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROD_REF }}
        run: |
          set -e
          echo "::group::Link to prod project"
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          echo "::endgroup::"

          # Ghost-repair loop removed 2026-05-13: prod schema_migrations was
          # manually reconciled (17 recorded with proper names, 4 truly-pending
          # rows deleted so db push re-applies them naturally). No repair-step
          # needed — db push --include-all handles the remainder.
          # See PR #375, #376 commit history for the migration-recovery saga.

          echo "::group::Push all pending migrations"
          # db push diffs local against schema_migrations on remote and
          # applies only what is not yet recorded. --include-all is REQUIRED
          # when any pending migration has an older timestamp than remote tip
          # (the repaired ghost 20260503174428 < remote tip 20260524000000).
          # --include-all does NOT force re-apply of already-recorded
          # migrations — it just permits out-of-order insertion. Without it
          # CLI exits 1 with "Found local migration files to be inserted
          # before the last migration on remote database."
          supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
          echo "::endgroup::"

      - name: Seed cron secrets into Vault (ADR-0388)
        # The 27 pg_cron http_post jobs read secrets via public.get_secret(name)
        # → vault.decrypted_secrets. (GUCs are NOT usable: Supabase blocks
        # ALTER ROLE/DATABASE SET for the postgres role — 42501. Vault IS
        # writable by postgres.) Upsert the 5 secrets from GH secrets each main
        # deploy (idempotent). Connect as postgres via the session-mode pooler.
        # Values GH-masked in logs; no -x/-e echo.
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROD_REF }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPA_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}
          WATCHDOG_CRON_SECRET: ${{ secrets.WATCHDOG_CRON_SECRET }}
          PROCESS_NOTIFICATIONS_SECRET: ${{ secrets.PROCESS_NOTIFICATIONS_SECRET }}
          MORNING_DIGEST_SECRET: ${{ secrets.MORNING_DIGEST_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${WATCHDOG_CRON_SECRET:-}" ]; then
            echo "::error::WATCHDOG_CRON_SECRET GH secret missing — cron http jobs 401. Add it + PROCESS_NOTIFICATIONS_SECRET + MORNING_DIGEST_SECRET to repo secrets. (ADR-0388)"
            exit 1
          fi
          PSQL="psql -v ON_ERROR_STOP=1 -h aws-1-eu-west-1.pooler.supabase.com -p 5432 -U postgres.${SUPABASE_PROJECT_REF} -d postgres"
          # Single session: env vars expand into stdin SQL (not argv). Idempotent
          # upsert per secret. \$up\$ escapes the dollar-quote from the shell.
          $PSQL <<SQL
          DO \$up\$
          DECLARE sid uuid;
          BEGIN
            SELECT id INTO sid FROM vault.secrets WHERE name='supabase_url';
            IF sid IS NULL THEN PERFORM vault.create_secret('$SUPA_URL','supabase_url','cron'); ELSE PERFORM vault.update_secret(sid,'$SUPA_URL'); END IF;
            SELECT id INTO sid FROM vault.secrets WHERE name='service_role_key';
            IF sid IS NULL THEN PERFORM vault.create_secret('$SERVICE_ROLE_KEY','service_role_key','cron'); ELSE PERFORM vault.update_secret(sid,'$SERVICE_ROLE_KEY'); END IF;
            SELECT id INTO sid FROM vault.secrets WHERE name='watchdog_cron_secret';
            IF sid IS NULL THEN PERFORM vault.create_secret('$WATCHDOG_CRON_SECRET','watchdog_cron_secret','cron'); ELSE PERFORM vault.update_secret(sid,'$WATCHDOG_CRON_SECRET'); END IF;
            SELECT id INTO sid FROM vault.secrets WHERE name='process_notifications_secret';
            IF sid IS NULL THEN PERFORM vault.create_secret('$PROCESS_NOTIFICATIONS_SECRET','process_notifications_secret','cron'); ELSE PERFORM vault.update_secret(sid,'$PROCESS_NOTIFICATIONS_SECRET'); END IF;
            SELECT id INTO sid FROM vault.secrets WHERE name='morning_digest_secret';
            IF sid IS NULL THEN PERFORM vault.create_secret('$MORNING_DIGEST_SECRET','morning_digest_secret','cron'); ELSE PERFORM vault.update_secret(sid,'$MORNING_DIGEST_SECRET'); END IF;
          END
          \$up\$;
          SQL
          echo "✓ cron secrets upserted into Vault (next pg_cron firing reads them)"

  # ── Migration state poller (ADR-0262) ──────────────────────────
  # On main push: assert prod's last applied migration timestamp matches the
  # latest local migration file. Catches MIGRATIONS_FAILED state immediately.
  # Depends on db-push so it runs AFTER migrations have been applied.
  migration-state:
    name: Migration State
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [db-push]
    steps:
      - uses: actions/checkout@v4
      - name: Compare local migration tail vs prod last applied
        env:
          SUPABASE_PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}
        run: |
          set -e
          LATEST_LOCAL=$(ls supabase/migrations/*.sql 2>/dev/null \
            | xargs -n1 basename | grep -E '^[0-9]{14}_' | sort | tail -1 | cut -d_ -f1)
          if [ -z "$LATEST_LOCAL" ]; then
            echo "No local migrations found — skipping check."
            exit 0
          fi
          # Query supabase_migrations.schema_migrations directly via REST.
          LATEST_PROD=$(curl -fsS \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_PROD_URL/rest/v1/rpc/migration_state_latest" \
            -X POST -H "Content-Type: application/json" -d '{}' \
            | tr -d '"' | tr -d ' ')
          echo "local=$LATEST_LOCAL prod=$LATEST_PROD"
          if [ "$LATEST_LOCAL" != "$LATEST_PROD" ]; then
            echo "::error::Migration drift — local tail $LATEST_LOCAL ≠ prod last applied $LATEST_PROD"
            echo "::error::Production may be in MIGRATIONS_FAILED state. Check Supabase dashboard."
            exit 1
          fi
          echo "✅ migrations in sync"

  # ── Migration coherence check (feat/ci-migration-coherence-check) ─
  # On main push: run supabase db diff --linked after db-push and compare
  # the captured diff against the committed baseline. Catches NEW drift
  # (ghost migrations, manual prod DDL) while tolerating known migra-tool
  # cosmetic noise (pg_get_functiondef format differs from migration source).
  #
  # See:
  #   docs/plans/PLAN-ci-migration-coherence-check.md
  #   docs/decisions/0361-ci-migration-coherence-check.md
  #   docs/learnings/0302-ghost-migration-from-reconciliation.md
  #   supabase/migration-coherence-baseline.sql (the allowed-cosmetic baseline)
  migration-coherence:
    name: Migration Coherence
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [db-push]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned 2026-05-20 — `latest` resolved to a CLI revision that flags
          # Supabase platform baseline migrations (00001-00013) as orphans,
          # producing false-positive "Remote migration versions not found in
          # local migrations directory" failures on every main push.
          # CLI 2.100.1 correctly filters platform baselines via supabase REST.
          version: 2.100.1
      - name: Compare local migrations vs prod schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROD_REF }}
        run: |
          set -e
          BASELINE=supabase/migration-coherence-baseline.sql
          if [ ! -f "$BASELINE" ]; then
            echo "::error::Baseline file $BASELINE missing — required by ADR-0361"
            echo "Regenerate via: supabase db diff --linked --schema public,payroll,websites,timesheet | sed -n '<start>,<end>p' > $BASELINE"
            exit 1
          fi

          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

          # Capture raw diff + strip CLI chatter to get pure SQL content.
          # Boundary markers: "Finished supabase db diff" (start) — end of file.
          RAW=$(supabase db diff --linked --schema public,payroll,websites,timesheet 2>&1)

          # Extract everything AFTER the "Finished supabase db diff" line, which
          # marks the boundary between shadow-DB setup chatter and actual diff SQL.
          # Also strip trailing "Found drop statements ..." advisory block.
          CURRENT=$(echo "$RAW" \
            | awk '/^Finished supabase db diff/{found=1; next} found' \
            | awk '/^Found drop statements/{exit} {print}')

          # Compare current diff to committed baseline.
          # -B: ignore differences that are blank-line-only (handles awk
          #     extraction whitespace variance between local-capture and
          #     GitHub-runner-capture).
          # -w: ignore all whitespace (further guards against migra format jitter).
          DELTA=$(diff -uBw "$BASELINE" <(echo "$CURRENT") || true)

          if [ -n "$DELTA" ]; then
            echo "::error::Migration coherence failed — diff vs baseline non-empty"
            echo "==================== DELTA vs BASELINE ===================="
            echo "$DELTA"
            echo "==========================================================="
            echo ""
            echo "Likely causes:"
            echo "  - Ghost migration (recorded but DDL not applied)"
            echo "  - Manual prod DDL touch (SQL Editor, supabase migration repair, etc.)"
            echo "  - Out-of-order migration push"
            echo "  - Function/view definition drift outside known migra-cosmetic class"
            echo ""
            echo "Recovery (if real drift):"
            echo "  1. Write forward-only migration aligning prod → local source of truth"
            echo "  2. Push via dev → preview → main pipeline"
            echo "  3. Re-run job; baseline should now reabsorb to clean state"
            echo ""
            echo "If intentional schema change updated cosmetic baseline:"
            echo "  1. Regenerate baseline: supabase db diff --linked > /tmp/raw && extract diff section"
            echo "  2. Commit updated $BASELINE"
            echo "  3. PR + merge"
            exit 1
          fi
          echo "✓ Prod schema diff matches committed baseline (known cosmetic only)"

      - name: Verify pg_cron jobs registered in prod (ADR-0388)
        # Coherence is more than schema shape: a guarded cron.schedule() can
        # record "applied" yet register ZERO jobs when pg_cron is disabled in
        # the target env (the silent-skip class — see ADR-0388). Assert prod
        # actually holds the canonical job set.
        env:
          SUPABASE_PROD_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          CANON=$(grep -rl "CRON-REGISTRY-CANONICAL" supabase/migrations/*.sql 2>/dev/null | head -1 || true)
          if [ -z "$CANON" ]; then
            echo "::error::No canonical cron-registry migration (marker CRON-REGISTRY-CANONICAL). See ADR-0388."
            exit 1
          fi
          EXPECTED=$(perl -0777 -ne 'while(/cron\.schedule\s*\(\s*\x27([^\x27]+)\x27/g){print "$1\n"}' "$CANON" | sort -u | grep -c .)
          echo "canonical registry: $CANON (expects >= $EXPECTED jobs)"

          HTTP=$(mktemp)
          CODE=$(curl -s -o "$HTTP" -w '%{http_code}' \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -X POST "$SUPABASE_PROD_URL/rest/v1/rpc/fn_cron_jobs_health" -d '{}')
          BODY=$(cat "$HTTP"); rm -f "$HTTP"
          echo "rpc http=$CODE body=$BODY"

          # Graceful-degrade: if the RPC is not yet deployed (PostgREST PGRST202
          # / 404), the ADR-0388 migration hasn't reached prod yet — warn instead
          # of false-red so this verifier can ship in a release before/with it.
          if echo "$BODY" | grep -q "PGRST202" || [ "$CODE" = "404" ]; then
            echo "::warning::fn_cron_jobs_health() not deployed yet (ADR-0388 migration not on prod). Skipping cron assertion."
            exit 0
          fi
          if [ "$CODE" != "200" ]; then
            echo "::error::cron health RPC failed (http $CODE): $BODY"
            exit 1
          fi

          ENABLED=$(echo "$BODY" | jq -r '.pg_cron_enabled')
          COUNT=$(echo "$BODY" | jq -r '.count')
          if [ "$ENABLED" != "true" ]; then
            echo "::error::pg_cron NOT enabled in prod — guarded cron.schedule() calls silently skipped. Enable the pg_cron extension. (ADR-0388)"
            exit 1
          fi
          if [ "$COUNT" -lt "$EXPECTED" ]; then
            echo "::error::Cron drift — prod registered $COUNT jobs, canonical registry expects >= $EXPECTED. (ADR-0388)"
            exit 1
          fi
          echo "✓ pg_cron healthy: $COUNT jobs registered in prod (>= $EXPECTED expected)"
