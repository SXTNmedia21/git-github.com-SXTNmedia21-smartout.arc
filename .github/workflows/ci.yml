name: CI

on:
  push:
    branches: [SmartOut.ai]
  pull_request:
    branches: [SmartOut.ai]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all apps
        env:
          # Placeholder values for CI build — @supabase/ssr validates these
          # exist at client creation time. Real values are set in Vercel.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
        run: pnpm turbo run build
      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-next-build
          path: apps/web/.next
          include-hidden-files: true
      - name: Upload landing build artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-next-build
          path: apps/landing/.next
          include-hidden-files: true

  verify:
    name: Post-Build Verification
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verify package exports
        run: |
          pnpm --filter @smartout/types exec tsc --noEmit
          pnpm --filter @smartout/supabase exec tsc --noEmit
          pnpm --filter @smartout/ui exec tsc --noEmit
          pnpm --filter @smartout/telemetry exec tsc --noEmit

  build-health:
    name: Build Health
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:health
      - name: Upload build health artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-health-report
          path: artifacts/quality/build-health-report.json

  perf-budgets:
    name: Performance Budgets
    runs-on: ubuntu-latest
    needs: [build]
    env:
      PERF_ENFORCEMENT: ${{ github.event_name == 'pull_request' && 'warn' || 'fail' }}
      # Placeholder values — web app needs these to start for perf audits
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    strategy:
      fail-fast: false
      matrix:
        app: [web, landing]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download web build artifact
        if: matrix.app == 'web'
        uses: actions/download-artifact@v4
        with:
          name: web-next-build
          path: apps/web/.next
      - name: Download landing build artifact
        if: matrix.app == 'landing'
        uses: actions/download-artifact@v4
        with:
          name: landing-next-build
          path: apps/landing/.next
      - name: Start target app
        run: pnpm --filter ${{ matrix.app }} start &
      - name: Wait for app readiness
        run: |
          if [ "${{ matrix.app }}" = "web" ]; then
            npx wait-on http://127.0.0.1:3050
          else
            npx wait-on http://127.0.0.1:3055
          fi
      - name: Run perf budget audit
        continue-on-error: ${{ env.PERF_ENFORCEMENT != 'fail' }}
        run: |
          if [ "${{ matrix.app }}" = "web" ]; then
            pnpm perf:audit:web
          else
            pnpm perf:audit:landing
          fi
      - name: Upload perf artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report-${{ matrix.app }}
          path: artifacts/perf/*

  api-docs-go-live-guard:
    name: API Docs Go-Live Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify go-live API spec is up to date
        run: pnpm api:docs:verify-go-live
