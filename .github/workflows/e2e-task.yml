name: E2E — Task Capability (ADR-0298)

# On-demand E2E for the task capability journey-spec.
# Boots Supabase Local + web + landing dev servers, runs the 4 Playwright
# specs that cover ADR-0298 task ontology end-to-end (mobile BFF complete,
# source dispatcher, canonical task-created event, daily-operation add-task).
#
# Not part of required-checks. workflow_dispatch only — manual trigger via
# `gh workflow run e2e-task.yml --ref <branch>` or GitHub UI.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/SHA to run against (defaults to caller ref)"
        required: false
        default: ""
  push:
    branches:
      - development
    paths:
      - ".github/workflows/e2e-task.yml"
      - "apps/e2e/tests/daily-operation-tasks-add-task.spec.ts"
      - "apps/e2e/tests/sortie-p0-fix-sweep-task-created-canonical.spec.ts"
      - "apps/e2e/tests/sortie-1-mobile-task-complete.spec.ts"
      - "apps/e2e/tests/sortie-p0-fix-sweep-task-complete-source.spec.ts"
      - "packages/ai/src/capabilities/task/**"
      - "apps/web/src/app/api/mobile/tasks/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-task:
    name: Task Capability E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
      CI: "true"
      E2E_WORKERS: "1"
      NEXT_PUBLIC_STAGE_ENGINE_URL: http://127.0.0.1:5010
      STAGE_ENGINE_URL: http://127.0.0.1:5010
      NEXT_PUBLIC_ROOT_DOMAIN: localhost
      NEXT_PUBLIC_WEB_APP_URL: http://127.0.0.1:3060
      SMTP_DEV_HOST: 127.0.0.1:54325

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Set CI env stubs (satisfies env.ts Zod validation; no external calls in task specs)
        run: |
          {
            printf 'DOCUSEAL_WEBHOOK_SECRET=%s\n' "ci-stub-docuseal-32characters-ok"
            printf 'SENDGRID_API_KEY=%s\n' "ci-stub-sendgrid-not-real-value"
            printf 'STRIPE_SECRET_KEY=%s\n' "sk_test_cistub"
            printf 'STRIPE_WEBHOOK_SECRET=%s\n' "whsec_cistub"
            printf 'STAGE_ENGINE_API_KEY=%s\n' "ci-stub-stage-engine-key-12345ok"
          } >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local
        run: npx supabase start

      - name: Verify Supabase is ready
        run: |
          psql "$DATABASE_URL" -c "SELECT version();"
          psql "$DATABASE_URL" -c "SELECT count(*) AS migrations FROM supabase_migrations.schema_migrations;"

      - name: Install Playwright browsers
        working-directory: apps/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Pre-clean fixture rows (avoid uq_dept_session_date / uq_payroll_period drift)
        run: |
          TODAY=$(date +%F)
          psql "$DATABASE_URL" <<SQL
          DELETE FROM session_task WHERE department_session_id IN (
            SELECT department_session_id FROM department_session
            WHERE department_id='d0000000-0000-0000-0000-000000000000' AND session_date='$TODAY'
          );
          DELETE FROM department_session
            WHERE department_id='d0000000-0000-0000-0000-000000000000' AND session_date='$TODAY';
          DELETE FROM payroll.calculation
            WHERE workspace_id='b0000000-0000-0000-0000-000000000000' AND period_id IN (
              SELECT id FROM payroll.period
              WHERE workspace_id='b0000000-0000-0000-0000-000000000000' AND start_date='2026-03-01'
            );
          DELETE FROM payroll.period
            WHERE workspace_id='b0000000-0000-0000-0000-000000000000' AND start_date='2026-03-01';
          SQL

      - name: Run task journey E2E specs
        working-directory: apps/e2e
        run: |
          pnpm test:e2e \
            tests/daily-operation-tasks-add-task.spec.ts \
            tests/sortie-p0-fix-sweep-task-created-canonical.spec.ts \
            tests/sortie-1-mobile-task-complete.spec.ts \
            tests/sortie-p0-fix-sweep-task-complete-source.spec.ts \
            --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Capture Supabase logs on failure
        if: failure()
        run: |
          mkdir -p artifacts/e2e
          npx supabase status > artifacts/e2e/supabase-status.txt 2>&1 || true
          docker ps -a > artifacts/e2e/docker-ps.txt 2>&1 || true
          for c in $(docker ps -aq --filter "name=supabase"); do
            name=$(docker inspect --format='{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "artifacts/e2e/${name}.log" 2>&1 || true
          done

      - name: Upload Supabase logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-supabase-logs
          path: artifacts/e2e/
          retention-days: 7

      - name: Stop Supabase Local
        if: always()
        run: npx supabase stop --no-backup || true
