<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Botsson Chat Playground</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0d0d;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 0 12px;
  }

  /* ── Config panel ── */
  .config-panel {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .config-panel h1 {
    font-size: 14px;
    font-weight: 600;
    color: #a0a0a0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  .config-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .config-row label {
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    color: #888;
    min-width: 80px;
    flex-shrink: 0;
  }

  .config-row input {
    flex: 1;
    background: #111;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e0e0e0;
    font-size: 13px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    padding: 6px 10px;
    outline: none;
  }

  .config-row input:focus {
    border-color: #555;
  }

  .config-row input::placeholder {
    color: #555;
  }

  #btn-new-session {
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    color: #ccc;
    font-size: 12px;
    padding: 6px 14px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }

  #btn-new-session:hover {
    background: #333;
    color: #fff;
  }

  /* ── Chat area ── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }

  .chat-area::-webkit-scrollbar {
    width: 6px;
  }

  .chat-area::-webkit-scrollbar-track {
    background: transparent;
  }

  .chat-area::-webkit-scrollbar-thumb {
    background: #333;
    border-radius: 3px;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
  }

  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }

  .msg.assistant {
    align-self: flex-start;
    align-items: flex-start;
  }

  .msg-role {
    font-size: 10px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 3px;
  }

  .msg.user .msg-role { color: #6b8aff; }
  .msg.assistant .msg-role { color: #5ec47a; }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.user .msg-bubble {
    background: #1e2a4a;
    border: 1px solid #2a3a6a;
    color: #d0d8f0;
  }

  .msg.assistant .msg-bubble {
    background: #1a2e1a;
    border: 1px solid #2a4a2a;
    color: #d0f0d0;
  }

  .msg-meta {
    font-size: 11px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    color: #555;
    margin-top: 4px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .msg-meta .intent {
    color: #8a7acc;
  }

  .msg-meta .confidence {
    color: #7aaa7a;
  }

  .msg-meta .response-time {
    color: #aa8a5a;
  }

  .thinking {
    align-self: flex-start;
    font-size: 13px;
    color: #666;
    font-style: italic;
    padding: 8px 0;
  }

  .thinking::after {
    content: '';
    animation: dots 1.4s steps(4, end) infinite;
  }

  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
    100% { content: ''; }
  }

  /* ── Input area ── */
  .input-area {
    display: flex;
    gap: 8px;
    padding: 12px 0;
    border-top: 1px solid #222;
  }

  #msg-input {
    flex: 1;
    background: #111;
    border: 1px solid #333;
    border-radius: 6px;
    color: #e0e0e0;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    font-family: inherit;
  }

  #msg-input:focus {
    border-color: #555;
  }

  #msg-input::placeholder {
    color: #555;
  }

  #msg-input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #btn-send {
    background: #2a4a8a;
    border: none;
    border-radius: 6px;
    color: #d0d8f0;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 20px;
    cursor: pointer;
    flex-shrink: 0;
  }

  #btn-send:hover {
    background: #3a5a9a;
  }

  #btn-send:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ── Status bar ── */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0 12px;
    font-size: 11px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    color: #555;
    border-top: 1px solid #1a1a1a;
  }

  .status-bar .session-id {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 70%;
  }

  .error-msg {
    align-self: center;
    background: #3a1a1a;
    border: 1px solid #5a2a2a;
    border-radius: 6px;
    color: #f0a0a0;
    padding: 8px 14px;
    font-size: 13px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    max-width: 90%;
    word-wrap: break-word;
  }
</style>
</head>
<body>
  <div class="container">
    <!-- Config panel -->
    <div class="config-panel">
      <h1>Mr. Botsson — Chat Playground</h1>
      <div class="config-row">
        <label>Engine URL</label>
        <input type="text" id="cfg-url" placeholder="http://localhost:3000" />
      </div>
      <div class="config-row">
        <label>API Key</label>
        <input type="text" id="cfg-apikey" placeholder="smo_sk_live_..." />
      </div>
      <div class="config-row">
        <label>Profile ID</label>
        <input type="text" id="cfg-profile" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />
        <button id="btn-new-session">New Session</button>
      </div>
    </div>

    <!-- Chat area -->
    <div class="chat-area" id="chat-area"></div>

    <!-- Input area -->
    <div class="input-area">
      <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" />
      <button id="btn-send">Send</button>
    </div>

    <!-- Status bar -->
    <div class="status-bar">
      <span class="session-id" id="status-session">Session: none</span>
      <span id="status-turns">Turns: 0</span>
    </div>
  </div>

<script>
(function () {
  // ── DOM refs ──
  const cfgUrl     = document.getElementById('cfg-url');
  const cfgApiKey  = document.getElementById('cfg-apikey');
  const cfgProfile = document.getElementById('cfg-profile');
  const btnNewSession = document.getElementById('btn-new-session');
  const chatArea   = document.getElementById('chat-area');
  const msgInput   = document.getElementById('msg-input');
  const btnSend    = document.getElementById('btn-send');
  const statusSession = document.getElementById('status-session');
  const statusTurns   = document.getElementById('status-turns');

  // ── State ──
  let sessionId = null;
  let turnCount = 0;
  let sending = false;

  // ── LocalStorage ──
  function loadConfig() {
    cfgUrl.value     = localStorage.getItem('botsson_engine_url') || 'http://localhost:3000';
    cfgApiKey.value  = localStorage.getItem('botsson_api_key') || '';
    cfgProfile.value = localStorage.getItem('botsson_profile_id') || '';
  }

  function saveConfig() {
    localStorage.setItem('botsson_engine_url', cfgUrl.value.trim());
    localStorage.setItem('botsson_api_key', cfgApiKey.value.trim());
    localStorage.setItem('botsson_profile_id', cfgProfile.value.trim());
  }

  cfgUrl.addEventListener('change', saveConfig);
  cfgApiKey.addEventListener('change', saveConfig);
  cfgProfile.addEventListener('change', saveConfig);

  // ── Status ──
  function updateStatus() {
    statusSession.textContent = sessionId
      ? 'Session: ' + sessionId
      : 'Session: none';
    statusTurns.textContent = 'Turns: ' + turnCount;
  }

  // ── New session ──
  btnNewSession.addEventListener('click', function () {
    sessionId = null;
    turnCount = 0;
    chatArea.innerHTML = '';
    updateStatus();
    msgInput.focus();
  });

  // ── Render messages ──
  function timestamp() {
    return new Date().toLocaleTimeString('en-GB', { hour12: false });
  }

  function addUserMessage(text) {
    var div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML =
      '<span class="msg-role">user</span>' +
      '<div class="msg-bubble">' + escapeHtml(text) + '</div>' +
      '<div class="msg-meta"><span>' + timestamp() + '</span></div>';
    chatArea.appendChild(div);
    scrollToBottom();
  }

  function addAssistantMessage(text, intent, confidence, responseMs) {
    var div = document.createElement('div');
    div.className = 'msg assistant';

    var metaParts = ['<span>' + timestamp() + '</span>'];
    if (intent) {
      metaParts.push('<span class="intent">intent: ' + escapeHtml(intent) + '</span>');
    }
    if (confidence !== undefined && confidence !== null) {
      metaParts.push('<span class="confidence">confidence: ' + (confidence * 100).toFixed(1) + '%</span>');
    }
    if (responseMs !== undefined) {
      metaParts.push('<span class="response-time">' + responseMs + 'ms</span>');
    }

    div.innerHTML =
      '<span class="msg-role">assistant</span>' +
      '<div class="msg-bubble">' + escapeHtml(text) + '</div>' +
      '<div class="msg-meta">' + metaParts.join('') + '</div>';
    chatArea.appendChild(div);
    scrollToBottom();
  }

  function addError(text) {
    var div = document.createElement('div');
    div.className = 'error-msg';
    div.textContent = text;
    chatArea.appendChild(div);
    scrollToBottom();
  }

  function showThinking() {
    var div = document.createElement('div');
    div.className = 'thinking';
    div.id = 'thinking-indicator';
    div.textContent = 'Thinking';
    chatArea.appendChild(div);
    scrollToBottom();
  }

  function hideThinking() {
    var el = document.getElementById('thinking-indicator');
    if (el) el.remove();
  }

  function scrollToBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ── Send message ──
  async function sendMessage() {
    var text = msgInput.value.trim();
    if (!text || sending) return;

    var engineUrl = cfgUrl.value.trim();
    var apiKey    = cfgApiKey.value.trim();
    var profileId = cfgProfile.value.trim();

    if (!engineUrl) { addError('Engine URL is required.'); return; }
    if (!apiKey)    { addError('API Key is required.'); return; }
    if (!profileId) { addError('Profile ID is required.'); return; }

    saveConfig();
    addUserMessage(text);
    msgInput.value = '';

    sending = true;
    msgInput.disabled = true;
    btnSend.disabled = true;
    showThinking();

    var startTime = performance.now();

    try {
      var body = {
        message: text,
        profile_id: profileId,
        channel: 'chat'
      };
      if (sessionId) {
        body.session_id = sessionId;
      }

      var res = await fetch(engineUrl.replace(/\/+$/, '') + '/agent/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey
        },
        body: JSON.stringify(body)
      });

      var elapsed = Math.round(performance.now() - startTime);

      if (!res.ok) {
        var errText = '';
        try { errText = await res.text(); } catch (_) {}
        throw new Error('HTTP ' + res.status + (errText ? ': ' + errText : ''));
      }

      var data = await res.json();

      // Update session
      if (data.session_id) {
        sessionId = data.session_id;
      }

      turnCount++;

      var intentCapability = data.intent && data.intent.capability ? data.intent.capability : null;
      var intentConfidence = data.intent && data.intent.confidence !== undefined ? data.intent.confidence : null;

      hideThinking();
      addAssistantMessage(
        data.response || '(empty response)',
        intentCapability,
        intentConfidence,
        elapsed
      );
    } catch (err) {
      hideThinking();
      addError('Error: ' + err.message);
    } finally {
      sending = false;
      msgInput.disabled = false;
      btnSend.disabled = false;
      updateStatus();
      msgInput.focus();
    }
  }

  // ── Event listeners ──
  btnSend.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ── Init ──
  loadConfig();
  updateStatus();
  msgInput.focus();
})();
</script>
</body>
</html>
