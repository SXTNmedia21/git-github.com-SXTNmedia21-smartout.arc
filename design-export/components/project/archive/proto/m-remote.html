<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smartout — Fjernkontroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: "Geist", system-ui, sans-serif; background: #faf8f5; }
  @keyframes remotePulse { 0% { opacity:.5; transform:scale(1);} 70% { opacity:0; transform:scale(2.6);} 100% { opacity:0; transform:scale(2.6);} }
  @keyframes remotePulseRing { 0% { opacity:.55; transform:scale(.9);} 100% { opacity:0; transform:scale(1.8);} }
  @keyframes remoteRecBlink { 0%,100% { opacity:1;} 50% { opacity:.25;} }
  @keyframes remoteFlashIn { from { opacity:0; transform:translateY(-4px);} to { opacity:1; transform:none;} }
  @keyframes remoteExpand { from { opacity:0; transform:translateY(-4px);} to { opacity:1; transform:none;} }
  @keyframes remoteSnapFlash { 0% { opacity:0;} 30% { opacity:.8;} 100% { opacity:0;} }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="../remote/remote-data.js"></script>
<script type="text/babel" src="../remote/remote-primitives.jsx"></script>
<script type="text/babel" src="../remote/remote.jsx"></script>

<script type="text/babel">
  function Host() {
    const { scenario, steps } = REMOTE_DATA;
    return (
      <div style={{ minHeight: "100vh", padding: "28px", boxSizing: "border-box", maxWidth: 1000, margin: "0 auto" }}>
        <Remote scenario={scenario} steps={steps} theme="light" />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Host />);
</script>
</body>
</html>
