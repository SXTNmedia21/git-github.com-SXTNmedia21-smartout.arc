<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smartout — Dag-styring</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700;900&family=Geist+Mono:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: "Geist", system-ui, sans-serif; background: #fdfcfa; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
  @keyframes soPulse { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:.55; transform:scale(.85);} }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="../day/data.js"></script>
<script type="text/babel" src="../components/primitives.jsx"></script>
<script type="text/babel" src="../day/widgets.jsx"></script>
<script type="text/babel" src="../day/web-day.jsx"></script>
<script type="text/babel" src="../day/recon.jsx"></script>

<script type="text/babel">
  const params = new URLSearchParams(location.search);
  const screen = params.get("screen") || "day";
  const phase = params.get("phase") || "active";

  function Host() {
    const [h, setH] = React.useState(window.innerHeight);
    React.useEffect(() => {
      const onR = () => setH(window.innerHeight);
      window.addEventListener("resize", onR);
      return () => window.removeEventListener("resize", onR);
    }, []);
    if (screen === "recon") {
      return <div style={{ minHeight: "100vh", background: SO.secondary }}><ReconView /></div>;
    }
    return (
      <div style={{ minHeight: "100vh", background: SO.bg, padding: "20px 24px" }}>
        <WebDayControl phase={phase} initialTab="overview" height={h - 40} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Host />);
</script>
</body>
</html>
