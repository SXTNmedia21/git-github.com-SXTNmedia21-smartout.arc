<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protocol Monitor</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-card: #16213e;
      --text: #e0e0e0;
      --text-dim: #8892a4;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --gray: #4b5563;
      --mono: 'SF Mono','Cascadia Code','JetBrains Mono','Fira Code',monospace;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:var(--mono); background:var(--bg); color:var(--text); font-size:13px; line-height:1.6; }
    .banner { background:rgba(245,158,11,0.1); color:var(--amber); text-align:center; padding:4px; font-size:10px; }
    .header { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--gray); padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
    .header-left { display:flex; align-items:center; gap:12px; }
    .header h1 { font-size:14px; font-weight:600; }
    .protocol-id,.elapsed { color:var(--text-dim); font-size:12px; }
    .badge { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:4px; font-size:11px; font-weight:600; text-transform:uppercase; }
    .badge.running { background:rgba(245,158,11,0.15); color:var(--amber); }
    .badge.passed { background:rgba(34,197,94,0.15); color:var(--green); }
    .badge.failed { background:rgba(239,68,68,0.15); color:var(--red); }
    .steps { padding:16px 24px; }
    .step { display:grid; grid-template-columns:24px 1fr 80px; gap:12px; align-items:start; padding:12px 0; border-bottom:1px solid rgba(75,85,99,0.3); }
    .step:last-child { border-bottom:none; }
    .dot { width:10px; height:10px; border-radius:50%; margin-top:4px; }
    .dot.passed { background:var(--green); }
    .dot.failed,.dot.timeout { background:var(--red); }
    .dot.pending { border:2px solid var(--gray); background:transparent; }
    .dot.skipped { background:var(--gray); width:10px; height:2px; border-radius:1px; margin-top:8px; }
    .dot.running { background:var(--amber); animation:pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .step-info h3 { font-size:13px; font-weight:500; margin-bottom:2px; }
    .step-info .gate { font-size:11px; color:var(--text-dim); }
    .step-timing { text-align:right; font-size:12px; color:var(--text-dim); }
    .step-timing.slow { color:var(--amber); }
    .thumb { width:120px; height:75px; object-fit:cover; border-radius:4px; border:1px solid var(--gray); margin-top:8px; cursor:pointer; transition:opacity 0.2s; }
    .thumb:hover { opacity:0.8; }
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:100; cursor:pointer; align-items:center; justify-content:center; }
    .overlay.active { display:flex; }
    .overlay img { max-width:95vw; max-height:95vh; border-radius:8px; }
    .footer { position:sticky; bottom:0; background:var(--bg-card); border-top:1px solid var(--gray); padding:12px 24px; font-size:11px; color:var(--text-dim); display:flex; gap:24px; }
    .empty { text-align:center; padding:80px 24px; color:var(--text-dim); }
    .empty h2 { font-size:16px; margin-bottom:8px; color:var(--text); }
  </style>
</head>
<body>
  <div class="banner">SMARTOUT INFERENCE — local dev monitor</div>
  <div id="app">
    <div class="empty">
      <h2>Protocol Monitor</h2>
      <p>Waiting for protocol run...</p>
      <p style="margin-top:8px;font-size:11px">Run: pnpm --filter e2e test:protocol</p>
    </div>
  </div>
  <div class="overlay" id="overlay" onclick="this.classList.remove('active')">
    <img id="overlay-img" src="" alt="Screenshot">
  </div>
  <script>
    const BASE = '..';
    let lastJson = '';

    async function findLatest() {
      try {
        const r = await fetch(BASE + '/');
        if (!r.ok) return null;
        const html = await r.text();
        const m = html.match(/progress-[^"<]+\.json/g);
        return m ? m.sort().pop() : null;
      } catch { return null; }
    }

    async function poll() {
      const file = await findLatest();
      if (!file) return;
      try {
        const r = await fetch(BASE + '/' + file + '?t=' + Date.now());
        if (!r.ok) return;
        const json = await r.text();
        if (json === lastJson) return;
        lastJson = json;
        render(JSON.parse(json));
      } catch {}
    }

    function render(d) {
      const icon = d.status==='running'?'&#9203;':d.status==='passed'?'&#9989;':'&#10060;';
      document.title = icon + ' ' + d.protocol_id;

      const ok = d.steps.filter(s=>s.status==='passed').length;
      const fail = d.steps.filter(s=>['failed','timeout'].includes(s.status)).length;

      let h = `<div class="header"><div class="header-left"><h1>${d.protocol_name}</h1><span class="protocol-id">${d.protocol_id}</span><span class="badge ${d.status}">${d.status}</span></div><div><span class="elapsed">${(d.elapsed_ms/1000).toFixed(1)}s</span> &middot; <span class="elapsed">${ok}/${d.total_steps} passed</span>${fail>0?` &middot; <span style="color:var(--red)">${fail} failed</span>`:''}</div></div><div class="steps">`;

      for (const s of d.steps) {
        const dur = s.duration_ms!=null?(s.duration_ms/1000).toFixed(1)+'s':'';
        const slow = s.duration_ms!=null && s.duration_ms>10000;
        const tc = slow?'step-timing slow':'step-timing';
        const running = s.status==='running';

        h += `<div class="step"${running?' id="rs"':''}>`;
        h += `<div class="dot ${s.status}"></div>`;
        h += `<div class="step-info"><h3>${s.order}. ${s.title}</h3><div class="gate">${s.gate_summary}</div>`;
        if (s.screenshot) {
          const rel = s.screenshot.split('test-results/protocols/').pop();
          h += `<img class="thumb" src="${BASE}/${rel}" onclick="show(this.src)" alt="Step ${s.order}">`;
        }
        h += `</div>`;
        h += `<div class="${tc}">${running?'<span style="color:var(--amber)">running...</span>':dur}</div>`;
        h += `</div>`;
      }

      const total = d.steps.reduce((a,s)=>a+(s.duration_ms||0),0);
      h += `</div><div class="footer"><span>Total: ${(total/1000).toFixed(1)}s</span><span>Steps: ${d.current_step}/${d.total_steps}</span><span>Updated: ${new Date(d.updated_at).toLocaleTimeString()}</span></div>`;

      document.getElementById('app').innerHTML = h;
      const rs = document.getElementById('rs');
      if (rs) rs.scrollIntoView({behavior:'smooth',block:'center'});
    }

    function show(src) {
      document.getElementById('overlay-img').src = src;
      document.getElementById('overlay').classList.add('active');
    }

    setInterval(poll, 1000);
    poll();
  </script>
</body>
</html>
