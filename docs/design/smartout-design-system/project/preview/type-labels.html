<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css"></head>
<body><div class="frame">
  <div class="row" style="gap:16px;">
    <span class="t-badge" style="font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:0.15em; color:var(--muted-fg);">Badge</span>
    <span style="font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.125em; color:var(--muted-fg);">Section label</span>
  </div>
  <div class="row" style="gap:8px; margin-top:10px;">
    <span style="background:oklch(0.65 0.22 40 / 0.12); color:oklch(0.5 0.22 40); padding:2px 8px; border-radius:9999px; font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:2px;">Aktiv</span>
    <span style="background:oklch(0.65 0.13 225 / 0.12); color:oklch(0.45 0.13 225); padding:2px 8px; border-radius:9999px; font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:2px;">Trainee</span>
    <span style="background:oklch(0.75 0.15 75 / 0.14); color:oklch(0.5 0.12 75); padding:2px 8px; border-radius:9999px; font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:2px;">Offboarding</span>
  </div>
  <div style="font-family:var(--font-mono); font-size:10px; color:var(--muted-fg); margin-top:10px;">9–10px · uppercase · tracking 2px (widest)</div>
</div></body></html>
