<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css"></head>
<body><div class="frame frame-dark">
  <div class="grid" style="grid-template-columns: repeat(4, 1fr);">
    <div><div class="swatch" style="background:oklch(0.16 0.02 50); border-color:rgba(255,255,255,0.08);"></div>
      <div class="swatch-name" style="margin-top:8px">Card</div>
      <div class="swatch-label" style="color:rgba(255,255,255,0.5)">warm dark surface</div></div>
    <div><div class="swatch" style="background:oklch(0.12 0.015 50); border-color:rgba(255,255,255,0.08);"></div>
      <div class="swatch-name" style="margin-top:8px">Background</div>
      <div class="swatch-label" style="color:rgba(255,255,255,0.5)">warm dark base</div></div>
    <div><div class="swatch" style="background:oklch(0.269 0 0); border-color:rgba(255,255,255,0.08);"></div>
      <div class="swatch-name" style="margin-top:8px">Secondary</div>
      <div class="swatch-label" style="color:rgba(255,255,255,0.5)">muted dark</div></div>
    <div><div class="swatch" style="background:oklch(0.60 0.01 52); border-color:rgba(255,255,255,0.08);"></div>
      <div class="swatch-name" style="margin-top:8px">Muted FG</div>
      <div class="swatch-label" style="color:rgba(255,255,255,0.5)">secondary text</div></div>
  </div>
  <div style="margin-top:14px; font-size:11px; color:rgba(255,255,255,0.5); line-height:1.5;">
    Warm dark — hue preserved. Never a flat inversion.
  </div>
</div></body></html>
