<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css"></head>
<body><div class="frame">

    <span style="background:oklch(0.65 0.13 225 / 0.12); color:oklch(0.45 0.13 225); padding:3px 10px; border-radius:9999px; font-size:11px; font-weight:600;">Info</span>
  </div>
  <div class="row" style="gap:8px; margin-top:10px;">

    <span style="background:oklch(0.55 0 0 / 0.14); color:oklch(0.4 0 0); padding:2px 8px; border-radius:9999px; font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:2px;">Inaktiv</span>
  </div>
  <div style="font-family:var(--font-mono); font-size:10px; color:var(--muted-fg); margin-top:12px;">Pill · 10% bg · full color text · 9px uppercase status variant</div>
</div></body></html>
