<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css"></head>
<body><div class="frame">
  <div class="grid" style="grid-template-columns: repeat(4, 1fr);">
    <div><div class="swatch" style="background:oklch(0.68 0.15 145)"></div>
      <div class="swatch-name" style="margin-top:8px">Success</div>
      <div class="swatch-label">approved, active</div></div>
    <div><div class="swatch" style="background:oklch(0.75 0.15 75)"></div>
      <div class="swatch-name" style="margin-top:8px">Warning</div>
      <div class="swatch-label">pending, offboarding</div></div>
    <div><div class="swatch" style="background:oklch(0.60 0.20 25)"></div>
      <div class="swatch-name" style="margin-top:8px">Destructive</div>
      <div class="swatch-label">error, delete</div></div>
    <div><div class="swatch" style="background:oklch(0.65 0.13 225)"></div>
      <div class="swatch-name" style="margin-top:8px">Info</div>
      <div class="swatch-label">trainee, neutral</div></div>
  </div>
  <div class="row" style="margin-top:14px; gap:8px;">
    <span style="background:oklch(0.68 0.15 145 / 0.12); color:oklch(0.45 0.13 145); padding:3px 10px; border-radius:9999px; font-size:11px; font-weight:600;">Fullført</span>
    <span style="background:oklch(0.75 0.15 75 / 0.14); color:oklch(0.5 0.12 75); padding:3px 10px; border-radius:9999px; font-size:11px; font-weight:600;">Venter</span>
    <span style="background:oklch(0.60 0.20 25 / 0.12); color:oklch(0.48 0.2 25); padding:3px 10px; border-radius:9999px; font-size:11px; font-weight:600;">Avvist</span>
    <span style="background:oklch(0.65 0.13 225 / 0.12); color:oklch(0.45 0.13 225); padding:3px 10px; border-radius:9999px; font-size:11px; font-weight:600;">Trainee</span>
  </div>
</div></body></html>
