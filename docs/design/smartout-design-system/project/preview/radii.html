<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css"></head>
<body><div class="frame">
  <div class="grid" style="grid-template-columns:repeat(6,1fr); align-items:end;">
    <div><div style="width:24px;height:24px;background:var(--foreground);border-radius:6px;"></div><div class="swatch-label">6 · SM</div></div>
    <div><div style="width:32px;height:32px;background:var(--foreground);border-radius:8px;"></div><div class="swatch-label">8 · MD</div></div>
    <div><div style="width:40px;height:40px;background:var(--foreground);border-radius:10px;"></div><div class="swatch-label">10 · LG</div></div>
    <div><div style="width:48px;height:48px;background:var(--foreground);border-radius:14px;"></div><div class="swatch-label">14 · XL</div></div>
    <div><div style="width:56px;height:56px;background:var(--foreground);border-radius:16px;"></div><div class="swatch-label">16 · Card</div></div>
    <div><div style="width:44px;height:44px;background:var(--foreground);border-radius:9999px;"></div><div class="swatch-label">Full</div></div>
  </div>
</div></body></html>
