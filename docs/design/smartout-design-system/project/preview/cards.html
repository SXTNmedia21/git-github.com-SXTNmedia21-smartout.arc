<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css"></head>
<body><div class="frame" style="background:var(--secondary);">
  <div class="row" style="gap:12px; align-items:stretch;">
    <div style="flex:1; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; position:relative; overflow:hidden;">
      <div style="position:absolute; top:-30px; right:-30px; width:120px; height:120px; border-radius:9999px; background:oklch(0.65 0.22 40); opacity:0.15; filter:blur(40px);"></div>
      <div style="font-size:11px; color:var(--muted-fg); text-transform:uppercase; letter-spacing:0.1em; font-weight:600;">Timer denne uken</div>
      <div style="font-family:var(--font-mono); font-size:32px; font-weight:900; margin-top:10px;">24t</div>
      <div style="font-size:12px; color:var(--muted-fg); margin-top:2px;">+2.5 fra forrige uke</div>
    </div>
    <div style="flex:1; background:var(--card); border:1px solid var(--border); border-left:4px solid oklch(0.65 0.20 40); border-radius:16px; padding:18px;">
      <div style="font-size:20px; font-weight:600; line-height:1.3;">HACCP Temperaturtest</div>
      <div style="font-size:13px; color:var(--muted-fg); margin-top:4px;">Kjøkken · kl 18:00</div>
      <span style="display:inline-block; margin-top:8px; background:oklch(0.577 0.245 27.325 / 0.12); color:oklch(0.48 0.2 25); padding:3px 10px; border-radius:9999px; font-size:10px; font-weight:600;">URGENT</span>
    </div>
  </div>
</div></body></html>
