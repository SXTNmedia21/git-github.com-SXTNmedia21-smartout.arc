<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_frame.css"></head>
<body><div class="frame">
  <div class="grid" style="grid-template-columns: repeat(4, 1fr);">
    <div><div class="swatch" style="background:oklch(0.99 0.004 60)"></div>
      <div class="swatch-name" style="margin-top:8px">Background</div>
      <div class="swatch-label">warm cream</div></div>
    <div><div class="swatch" style="background:oklch(0.965 0.005 58)"></div>
      <div class="swatch-name" style="margin-top:8px">Secondary</div>
      <div class="swatch-label">subtle warm gray</div></div>
    <div><div class="swatch" style="background:oklch(0.91 0.006 55)"></div>
      <div class="swatch-name" style="margin-top:8px">Border</div>
      <div class="swatch-label">warm 1px line</div></div>
    <div><div class="swatch" style="background:oklch(0.52 0.01 52)"></div>
      <div class="swatch-name" style="margin-top:8px">Muted FG</div>
      <div class="swatch-label">secondary text</div></div>
    <div><div class="swatch" style="background:oklch(0.145 0.01 50)"></div>
      <div class="swatch-name" style="margin-top:8px;color:var(--foreground)">Foreground</div>
      <div class="swatch-label">warm black</div></div>
    <div><div class="swatch" style="background:oklch(0.18 0.03 50)"></div>
      <div class="swatch-name" style="margin-top:8px">Panel</div>
      <div class="swatch-label">Nordic Split dark</div></div>
    <div><div class="swatch" style="background:oklch(0.06 0.015 50)"></div>
      <div class="swatch-name" style="margin-top:8px">Panel Deep</div>
      <div class="swatch-label">auth finale</div></div>
    <div><div class="swatch" style="background:oklch(0.975 0.006 57)"></div>
      <div class="swatch-name" style="margin-top:8px">Sidebar</div>
      <div class="swatch-label">dashboard nav</div></div>
  </div>
</div></body></html>
