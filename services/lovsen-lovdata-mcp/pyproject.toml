[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lovsen-lovdata-mcp"
version = "0.1.0"
description = "Lovsen MCP server — Python stdio MCP for Lovdata.no (Norwegian law text)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.12.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
]

[project.scripts]
lovsen-lovdata-mcp = "server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "fixture_mode: marks tests that require LOVSEN_FIXTURE_MODE=true (canonical per ADR-0258)",
]
