[project]
name = "lovsen-nho-reiseliv-mcp"
version = "0.1.0"
description = "Stdio MCP server for NHO Reiseliv — Riksavtalen tariff agreement (LO/NHO hospitality collective agreement)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "pydantic>=2.7.4",
    "ratelimit>=2.2.1",
]

[project.scripts]
lovsen-nho-reiseliv-mcp = "src.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
